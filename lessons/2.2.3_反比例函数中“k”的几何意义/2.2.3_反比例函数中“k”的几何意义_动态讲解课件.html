/* ================= AMC10数论大屏授课专属样式与排版修正 ================= */
body, .slide, h1, h2, h3, .flowbar, .flowbar button, .eyebrow, .subfoot,
.slide-body, .screen-stem p, .screen-notes, .readout, .thm-scene-wrap, .prob-visual-card {
  font-family: 'SimSun', 'Songti SC', 'STSong', serif !important;
}
.m, i.m, .math {
  font-family: 'Times New Roman', Times, serif !important;
  font-style: italic !important;
  font-weight: inherit;
  padding: 0 1px;
}
.num {
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-weight: inherit;
}
sup, sub {
  font-family: 'Times New Roman', Times, serif !important;
  font-size: 0.72em !important;
  line-height: 0 !important;
  white-space: nowrap !important;
}
sub span, sub i, sub b,
sup span, sup i, sup b,
.fraction span, .fraction i, .frac span, .frac i {
  font-size: inherit !important;
}
.tri-sym {
  font-family: 'Songti SC', 'SimSun', serif !important;
  font-style: normal !important;
  font-size: 0.80em !important;
  display: inline-block;
  transform: translateY(-0.07em);
  margin: 0 -0.06em 0 -0.04em;
  line-height: 1 !important;
}
.fraction, .frac {
  display: inline-flex;
  vertical-align: middle;
  position: relative;
  top: -0.07em;
  flex-direction: column;
  align-items: center;
  text-align: center;
  line-height: 1.06;
  margin: 0 0.12em;
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-weight: inherit;
  font-size: 0.88em;
}
.fraction > span:first-child, .frac > span:first-child {
  border-bottom: 1.8px solid currentColor;
  padding: 0 0.22em 1px;
}
.fraction > span:last-child, .frac > span:last-child {
  padding: 1px 0.22em 0;
}
.sqrt {
  display: inline-block !important;
  vertical-align: baseline !important;
  position: relative !important;
  padding-left: 0.54em !important;
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-weight: inherit;
  line-height: 1 !important;
  margin: 0 2px 0 1px !important;
  white-space: nowrap !important;
}
.sqrt:has(> .sqrt-hook)::before {
  content: none !important;
  display: none !important;
}
.sqrt-hook {
  position: absolute !important;
  left: 0 !important;
  top: 0 !important;
  width: 0.56em !important;
  height: 100% !important;
  display: block !important;
  overflow: visible !important;
  pointer-events: none !important;
}
.sqrt::before {
  content: "" !important;
  position: absolute !important;
  left: 0 !important;
  top: 0 !important;
  bottom: 0.02em !important;
  width: 0.60em !important;
  background-color: currentColor !important;
  -webkit-clip-path: polygon(2% 58%, 20% 47%, 44% 83%, 91% 0%, 100% 0%, 100% 8.5%, 95% 8.5%, 45% 98%, 36% 98%, 15% 56%, 5% 63%) !important;
  clip-path: polygon(2% 58%, 20% 47%, 44% 83%, 91% 0%, 100% 0%, 100% 8.5%, 95% 8.5%, 45% 98%, 36% 98%, 15% 56%, 5% 63%) !important;
}
.sqrt > span {
  display: inline-block !important;
  border-top: 1.6px solid currentColor !important;
  padding: 1px 3px 0 2px !important;
  line-height: 1.02 !important;
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
}
.sqrt > span i.m {
  font-family: 'Times New Roman', Times, serif !important;
  font-style: italic !important;
}
.overline {
  border-top: 1.8px solid currentColor;
  padding-top: 1px;
  display: inline-block;
  line-height: 1.05;
}

/* 隐藏底栏重复的上一页/下一页按钮，统一由屏幕左右极简半圆箭头侧耳负责翻页 */

}

}

/* 屏幕左右边缘极简圆角矩形箭头翻页侧耳（大触控热区、低视觉干扰，开启批注时自动隐退） */
.edge-nav-paddle {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 15;
  width: 48px;
  height: 156px;
  border-radius: 0 16px 16px 0;
  background: rgba(30, 41, 59, 0.30);
  border: 1.5px solid rgba(148, 163, 184, 0.38);
  border-left: 0;
  color: rgba(255, 255, 255, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
  transition: transform 0.18s ease, background 0.18s ease, width 0.18s ease, color 0.18s ease;
  padding: 0;
}
.edge-nav-paddle.right {
  right: 0;
  left: auto;
  border-radius: 16px 0 0 16px;
  border-right: 0;
  border-left: 1.5px solid rgba(148, 163, 184, 0.38);
  padding-left: 2px;
}
.edge-nav-paddle.left {
  left: 0;
  padding-right: 2px;
}
.edge-nav-paddle svg {
  width: 32px;
  height: 32px;
  stroke: currentColor;
  stroke-width: 2.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.edge-nav-paddle:hover:not(:disabled) {
  width: 56px;
  background: rgba(2, 132, 199, 0.88);
  border-color: #7dd3fc;
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
}
.edge-nav-paddle:active:not(:disabled) {
  transform: translateY(-50%) scale(0.95);
}
.edge-nav-paddle:disabled {
  opacity: 0.12;
  cursor: default;
  pointer-events: none;
}
/* 关键防冲突机制：当开启批注画布（#penLayer.enabled）时，左右翻页侧耳自动隐藏并禁用点击 */
body:has(#penLayer.enabled) .edge-nav-paddle {
  display: none !important;
}

// ================= 数学真实坐标系 SVG 确定性绘图底座（SeewoCoordCanvas，杜绝口算像素与图形画错） =================
window.createCoordCanvas = function(arg1 = {}, arg2, arg3) {
  const opts = (typeof arg1 === 'number')
    ? Object.assign({ width: arg1, height: arg2 }, arg3 || {})
    : (arg1 || {});
  const W = opts.width || 560;
  const H = opts.height || 430;
  const pad = Object.assign({ left: 46, right: 36, top: 36, bottom: 38 }, opts.padding || {});
  const xMin = opts.xRange ? opts.xRange[0] : (opts.xMin !== undefined ? opts.xMin : -5);
  const xMax = opts.xRange ? opts.xRange[1] : (opts.xMax !== undefined ? opts.xMax : 5);
  const yMin = opts.yRange ? opts.yRange[0] : (opts.yMin !== undefined ? opts.yMin : -4);
  const yMax = opts.yRange ? opts.yRange[1] : (opts.yMax !== undefined ? opts.yMax : 4);
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;
  const rawScaleX = plotW / (xMax - xMin);
  const rawScaleY = plotH / (yMax - yMin);
  const spanRatio = (xMax - xMin) / Math.max(1e-6, yMax - yMin);
  const equalAspect = opts.equalAspect !== undefined
    ? Boolean(opts.equalAspect)
    : (!opts.xStep && !opts.yStep && opts.xMin === undefined && spanRatio >= 0.85 && spanRatio <= 1.45 && (xMax - xMin) <= 16);
  const scaleX = equalAspect ? Math.min(rawScaleX, rawScaleY) : rawScaleX;
  const scaleY = equalAspect ? Math.min(rawScaleX, rawScaleY) : rawScaleY;
  const ox = pad.left + (-xMin) * scaleX + (equalAspect ? (plotW - (xMax - xMin) * scaleX) / 2 : 0);
  const oy = pad.top + yMax * scaleY + (equalAspect ? (plotH - (yMax - yMin) * scaleY) / 2 : 0);
  const els = [];

  function px(x) { return ox + x * scaleX; }
  function py(y) { return oy - y * scaleY; }
  function pt(p) { return Array.isArray(p) ? [px(p[0]), py(p[1])] : [px(p.x), py(p.y)]; }

  const api = {
    W, H, ox, oy, scaleX, scaleY, px, py, pt,
    sx: px, sy: py, X: px, Y: py,
    raw(svgSnippet) { if (svgSnippet) els.push(svgSnippet); return this; },
    add(svgSnippet) { if (svgSnippet) els.push(svgSnippet); return this; },
    drawAxes(cfg = {}) {
      const x0 = px(xMin), x1 = px(xMax), y0 = py(yMin), y1 = py(yMax);
      const axisColor = cfg.color || '#1e293b';
      const xStep = cfg.xStep || opts.xStep || 1;
      const yStep = cfg.yStep || opts.yStep || 1;
      if (cfg.showGrid) {
        for (let gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax + 1e-6; gx += xStep) {
          if (Math.abs(gx) < 1e-6) continue;
          els.push(`<line x1="${px(gx).toFixed(1)}" y1="${y1.toFixed(1)}" x2="${px(gx).toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`);
        }
        for (let gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax + 1e-6; gy += yStep) {
          if (Math.abs(gy) < 1e-6) continue;
          els.push(`<line x1="${x0.toFixed(1)}" y1="${py(gy).toFixed(1)}" x2="${x1.toFixed(1)}" y2="${py(gy).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`);
        }
      }
      if (cfg.showTicks || opts.xStep || opts.yStep) {
        for (let gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax - xStep * 0.3; gx += xStep) {
          if (Math.abs(gx) < 1e-6 || gx < 0) continue;
          els.push(`<line x1="${px(gx).toFixed(1)}" y1="${oy.toFixed(1)}" x2="${px(gx).toFixed(1)}" y2="${(oy - 5).toFixed(1)}" stroke="${axisColor}" stroke-width="1.5"/>`);
          els.push(`<text x="${px(gx).toFixed(1)}" y="${(oy + 19).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">${Math.round(gx * 100) / 100}</text>`);
        }
        for (let gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax - yStep * 0.3; gy += yStep) {
          if (Math.abs(gy) < 1e-6 || gy < 0) continue;
          els.push(`<line x1="${ox.toFixed(1)}" y1="${py(gy).toFixed(1)}" x2="${(ox + 5).toFixed(1)}" y2="${py(gy).toFixed(1)}" stroke="${axisColor}" stroke-width="1.5"/>`);
          els.push(`<text x="${(ox - 7).toFixed(1)}" y="${(py(gy) + 4).toFixed(1)}" text-anchor="end" font-size="13" font-weight="600" fill="#475569">${Math.round(gy * 100) / 100}</text>`);
        }
      }
      els.push(`<line x1="${x0.toFixed(1)}" y1="${oy.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="${axisColor}" stroke-width="2"/>`);
      els.push(`<polygon points="${(x1 + 6).toFixed(1)},${oy.toFixed(1)} ${(x1 - 7).toFixed(1)},${(oy - 4.8).toFixed(1)} ${(x1 - 7).toFixed(1)},${(oy + 4.8).toFixed(1)}" fill="${axisColor}"/>`);
      els.push(`<line x1="${ox.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${axisColor}" stroke-width="2"/>`);
      els.push(`<polygon points="${ox.toFixed(1)},${(y1 - 6).toFixed(1)} ${(ox - 4.8).toFixed(1)},${(y1 + 7).toFixed(1)} ${(ox + 4.8).toFixed(1)},${(y1 + 7).toFixed(1)}" fill="${axisColor}"/>`);
      els.push(`<text x="${(x1 - 4).toFixed(1)}" y="${(oy + 24).toFixed(1)}" text-anchor="end" font-size="16" font-weight="700" fill="${axisColor}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(cfg.xLabel || opts.xLabel || 'x', 16)}</text>`);
      els.push(`<text x="${(ox + 12).toFixed(1)}" y="${(y1 + 14).toFixed(1)}" font-size="16" font-weight="700" fill="${axisColor}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(cfg.yLabel || opts.yLabel || 'y', 16)}</text>`);
      if (cfg.showOrigin !== false) {
        const oxOff = cfg.originOffset ? cfg.originOffset[0] : -16;
        const oyOff = cfg.originOffset ? cfg.originOffset[1] : 20;
        els.push(`<text x="${(ox + oxOff).toFixed(1)}" y="${(oy + oyOff).toFixed(1)}" font-size="16" font-weight="700" fill="${axisColor}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText('O', 16)}</text>`);
      }
      return this;
    },
    drawHyperbola(k, cfg = {}) {
      const color = cfg.color || '#1e293b';
      const width = cfg.width || 2.5;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      const branches = cfg.branches || ['pos', 'neg'];
      const stepCount = 70;
      branches.forEach(br => {
        const domMin = br === 'pos' ? Math.max(0.15, cfg.xMin || 0.25) : Math.min(-0.15, cfg.xMin || xMin + 0.2);
        const domMax = br === 'pos' ? Math.min(xMax - 0.15, cfg.xMax || xMax - 0.2) : Math.min(-0.15, cfg.xMax || -0.25);
        const pts = [];
        for (let i = 0; i <= stepCount; i++) {
          const x = domMin + (domMax - domMin) * (i / stepCount);
          const y = k / x;
          if (y < yMin + 0.15 || y > yMax - 0.15) continue;
          pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
        }
        if (pts.length > 1) {
          els.push(`<polyline fill="none" stroke="${color}" stroke-width="${width}"${dash} stroke-linecap="round" points="${pts.join(' ')}"/>`);
        }
      });
      return this;
    },
    curve(fn, domMin, domMax, colorOrCfg, widthArg, dashArg) {
      const cfg = (typeof colorOrCfg === 'object' && colorOrCfg !== null) ? colorOrCfg : { stroke: colorOrCfg, width: widthArg, dash: dashArg };
      const color = cfg.stroke || cfg.color || '#1e293b';
      const width = cfg.width || 2.6;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      const stepCount = 80;
      const pts = [];
      for (let i = 0; i <= stepCount; i++) {
        const x = domMin + (domMax - domMin) * (i / stepCount);
        const y = fn(x);
        if (!Number.isFinite(y) || y < yMin - (yMax - yMin) * 0.2 || y > yMax + (yMax - yMin) * 0.2) continue;
        pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
      }
      if (pts.length > 1) {
        els.push(`<polyline fill="none" stroke="${color}" stroke-width="${width}"${dash} stroke-linecap="round" points="${pts.join(' ')}"/>`);
      }
      return this;
    },
    shadedRegion(fn, x1, x2, fill = 'rgba(37,99,235,0.12)') {
      const stepCount = 40;
      const pts = [`${px(x1).toFixed(1)},${py(0).toFixed(1)}`];
      for (let i = 0; i <= stepCount; i++) {
        const x = x1 + (x2 - x1) * (i / stepCount);
        const y = fn(x);
        if (Number.isFinite(y)) pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
      }
      pts.push(`${px(x2).toFixed(1)},${py(0).toFixed(1)}`);
      els.push(`<polygon points="${pts.join(' ')}" fill="${fill}" stroke="none"/>`);
      return this;
    },
    drawPolygon(mathPts, cfg = {}) {
      const svgPts = mathPts.map(p => {
        const [sx, sy] = pt(p);
        return `${sx.toFixed(1)},${sy.toFixed(1)}`;
      }).join(' ');
      const fill = cfg.fill || 'rgba(37,99,235,0.16)';
      const stroke = cfg.stroke || '#2563eb';
      const width = cfg.width !== undefined ? cfg.width : 2.2;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      els.push(`<polygon points="${svgPts}" fill="${fill}" stroke="${stroke}" stroke-width="${width}"${dash} stroke-linejoin="round"/>`);
      return this;
    },
    polygon(mathPts, fillOrCfg, strokeArg, widthArg) {
      const cfg = (typeof fillOrCfg === 'object' && fillOrCfg !== null) ? fillOrCfg : { fill: fillOrCfg, stroke: strokeArg || 'none', width: widthArg !== undefined ? widthArg : (strokeArg ? 2 : 0) };
      return this.drawPolygon(mathPts, cfg);
    },
    drawSegment(p1, p2, cfg = {}) {
      const [x1, y1] = pt(p1), [x2, y2] = pt(p2);
      const color = cfg.stroke || cfg.color || '#475569';
      const width = cfg.width || 1.8;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      els.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${width}"${dash} stroke-linecap="round"/>`);
      return this;
    },
    line(x1, y1, x2, y2, colorOrCfg, widthArg, dashArg) {
      const cfg = (typeof colorOrCfg === 'object' && colorOrCfg !== null) ? colorOrCfg : { color: colorOrCfg, width: widthArg, dash: dashArg };
      return this.drawSegment([x1, y1], [x2, y2], cfg);
    },
    drawRightAngle(vertex, p1, p2, size = 9, color = '#475569') {
      const [vx, vy] = pt(vertex), [x1, y1] = pt(p1), [x2, y2] = pt(p2);
      const d1 = Math.hypot(x1 - vx, y1 - vy) || 1;
      const d2 = Math.hypot(x2 - vx, y2 - vy) || 1;
      const u1x = (x1 - vx) / d1 * size, u1y = (y1 - vy) / d1 * size;
      const u2x = (x2 - vx) / d2 * size, u2y = (y2 - vy) / d2 * size;
      els.push(`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${(vx + u1x).toFixed(1)},${(vy + u1y).toFixed(1)} ${(vx + u1x + u2x).toFixed(1)},${(vy + u1y + u2y).toFixed(1)} ${(vx + u2x).toFixed(1)},${(vy + u2y).toFixed(1)}"/>`);
      return this;
    },
    drawPoint(mathPt, cfg = {}) {
      const [sx, sy] = pt(mathPt);
      const r = cfg.r !== undefined ? cfg.r : 4.5;
      const color = cfg.color || '#1e293b';
      if (r > 0) {
        els.push(`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r}" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>`);
      }
      if (cfg.label) {
        const dx = cfg.dx !== undefined ? cfg.dx : 8;
        const dy = cfg.dy !== undefined ? cfg.dy : -8;
        const fs = cfg.fontSize || 16;
        const anchor = cfg.anchor || (dx < -2 ? 'end' : 'start');
        els.push(`<text x="${(sx + dx).toFixed(1)}" y="${(sy + dy).toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="700" fill="${cfg.labelColor || color}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(cfg.label, fs)}</text>`);
      }
      return this;
    },
    point(xOrPt, yOrCfg, labelArg, colorOrCfg, dxArg, dyArg, rArg) {
      if (Array.isArray(xOrPt)) return this.drawPoint(xOrPt, yOrCfg || {});
      const cfg = (typeof colorOrCfg === 'object' && colorOrCfg !== null)
        ? Object.assign({ label: labelArg }, colorOrCfg)
        : { label: labelArg, color: colorOrCfg, dx: dxArg, dy: dyArg, r: rArg };
      return this.drawPoint([xOrPt, yOrCfg], cfg);
    },
    projPoint(x, y, label, cfg = {}) {
      const color = cfg.color || '#1e293b';
      const dashColor = cfg.dashColor || '#64748b';
      this.drawSegment([x, y], [x, 0], { color: dashColor, width: 1.5, dash: '4,3' });
      this.drawSegment([x, y], [0, y], { color: dashColor, width: 1.5, dash: '4,3' });
      if (cfg.showTickX) {
        els.push(`<text x="${px(x).toFixed(1)}" y="${(oy + 19).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="${color}" stroke="#ffffff" stroke-width="4.5" paint-order="stroke">${Math.round(x * 100) / 100}</text>`);
      }
      if (cfg.showTickY) {
        els.push(`<text x="${(ox - 7).toFixed(1)}" y="${(py(y) + 4).toFixed(1)}" text-anchor="end" font-size="13" font-weight="700" fill="${color}" stroke="#ffffff" stroke-width="4.5" paint-order="stroke">${Math.round(y * 100) / 100}</text>`);
      }
      return this.drawPoint([x, y], Object.assign({}, cfg, { label }));
    },
    drawText(mathPt, textStr, cfg = {}) {
      const [sx, sy] = pt(mathPt);
      const fs = cfg.fontSize || cfg.size || 16;
      const anchor = cfg.anchor || 'middle';
      const color = cfg.fill || cfg.color || '#1e293b';
      els.push(`<text x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="${cfg.weight || 700}" fill="${color}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(textStr, fs)}</text>`);
      return this;
    },
    text(x, y, textStr, colorOrCfg, sizeArg, anchorArg, weightArg) {
      if (typeof colorOrCfg === 'object' && colorOrCfg !== null) {
        const fs = colorOrCfg.size || colorOrCfg.fontSize || 15;
        const anchor = colorOrCfg.anchor || 'start';
        const color = colorOrCfg.fill || colorOrCfg.color || '#1e293b';
        const weight = colorOrCfg.weight || 700;
        els.push(`<text x="${Number(x).toFixed(1)}" y="${Number(y).toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="${weight}" fill="${color}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(textStr, fs)}</text>`);
        return this;
      }
      return this.drawText([x, y], textStr, { color: colorOrCfg, fontSize: sizeArg, anchor: anchorArg, weight: weightArg });
    },
    drawFoCard(x, y, w, h, innerHtml, extraStyle = '') {
      els.push(window.svgFoCard(x, y, w, h, innerHtml, extraStyle));
      return this;
    },
    toSvg(extraAttr = '') {
      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;max-height:100%;display:block;" ${extraAttr}>${els.join('\n')}</svg>`;
    },
    done(extraAttr = '') {
      return this.toSvg(extraAttr);
    }
  };

  if (opts.xStep || opts.yStep || opts.autoAxes) {
    api.drawAxes({ showGrid: opts.showGrid !== false, showTicks: true, xLabel: opts.xLabel, yLabel: opts.yLabel });
  }

  return api;
};

// ================= 声明式课件页面构建器（window.defineSlide，强制 1对1 步数/填空/图形同步契约） =================
window.formatInlineMathHTML = function(rawStr) {
  if (!rawStr) return '';
  const s = String(rawStr);
  if (/<(span|i|sup|sub|b)\b/i.test(s)) return s;
  let clean = s
    .replace(/([\u4e00-\u9fff])\s+([A-Za-z0-9△▱∠⊥∥∽≌=+\-√])/g, '$1$2')
    .replace(/([A-Za-z0-9△▱∠⊥∥∽≌²³)])\s+([\u4e00-\u9fff])/g, '$1$2')
    .replace(/\s*([=+\-∶:∽≌∥⊥⇒])\s*/g, '$1');
  function fmtAtom(seg) {
    return seg.replace(/([0-9]+(?:\.[0-9]+)?)?√\(([^)]+)\)|([0-9]+(?:\.[0-9]+)?)?√([0-9A-Za-z²³+\-]+)|Rt△|△|[A-Za-z]+|[0-9]+(?:\.[0-9]+)?|[²³]|[=+\-±×÷·:∶∠⊥∥∽≌°⇒/]/g, (m, c1, radParen, c2, radBare) => {
      if (radParen !== undefined || radBare !== undefined) {
        const coef = c1 || c2 || '';
        const inner = radParen !== undefined ? radParen : radBare;
        const coefHtml = coef ? `<span class="num">${coef}</span>` : '';
        return `<span style="white-space:nowrap;">${coefHtml}<span class="sqrt"><span>${fmtAtom(inner)}</span></span></span>`;
      }
      if (m === 'Rt△') return '<span class="num">Rt</span><span class="tri-sym">△</span>';
      if (m === '△') return '<span class="tri-sym">△</span>';
      if (m === '²') return '<sup><span class="num">2</span></sup>';
      if (m === '³') return '<sup><span class="num">3</span></sup>';
      if (/^[A-Za-z]+$/.test(m)) return `<i class="m">${m}</i>`;
      return `<span class="num">${m}</span>`;
    });
  }
  return fmtAtom(clean);
};

window.renderMultiPanelScene = function(step, panels, opts = {}) {
  const W = opts.width || 560;
  const H = opts.height || 430;
  const list = Array.isArray(panels) ? panels : [];
  if (!list.length) return `<svg viewBox="0 0 ${W} ${H}"></svg>`;

  if (!step || step <= 0) {
    const n = list.length;
    const cols = n <= 2 ? 2 : (n === 3 ? 3 : (n === 4 ? 2 : 3));
    const rows = Math.ceil(n / cols);
    const padX = 12, padY = 10, gapX = 10, gapY = 10;
    const cellW = Math.floor((W - padX * 2 - gapX * (cols - 1)) / cols);
    const cellH = Math.floor((H - padY * 2 - gapY * (rows - 1)) / rows);
    const cells = list.map((p, idx) => {
      const r = Math.floor(idx / cols);
      const itemsInRow = (r === rows - 1 && n % cols !== 0) ? (n % cols) : cols;
      const rowW = itemsInRow * cellW + (itemsInRow - 1) * gapX;
      const startX = Math.floor((W - rowW) / 2);
      const c = idx % cols;
      const x0 = startX + c * (cellW + gapX);
      const y0 = padY + r * (cellH + gapY);
      const gotoStep = p.targetStep || (Array.isArray(p.steps) ? p.steps[0] : (idx + 1));
      const inner = typeof p.render === 'function' ? p.render({ x0, y0, w: cellW, h: cellH, zoomed: false, step: 0 }) : '';
      return `<g data-step-goto="${gotoStep}" style="cursor:pointer;">
        <rect x="${x0}" y="${y0}" width="${cellW}" height="${cellH}" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        ${p.title ? `<text x="${(x0 + cellW / 2).toFixed(1)}" y="${(y0 + 20).toFixed(1)}" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">${window.svgAutoFormatText(p.title, 13.5)}</text>` : ''}
        ${inner}
      </g>`;
    }).join('\n');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;max-height:100%;display:block;">${cells}</svg>`;
  }

  let activePanel = list.find(p => Array.isArray(p.steps) ? p.steps.includes(step) : p.targetStep === step);
  if (!activePanel) activePanel = list[Math.min(list.length - 1, Math.max(0, step - 1))];
  const zoomedInner = typeof activePanel.render === 'function'
    ? activePanel.render({ x0: 14, y0: 12, w: W - 28, h: H - 24, zoomed: true, step })
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;max-height:100%;display:block;">
    <rect x="14" y="12" width="${W - 28}" height="${H - 24}" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    ${activePanel.title ? `<text x="${(W / 2).toFixed(1)}" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">${window.svgAutoFormatText(activePanel.title, 16)}</text>` : ''}
    ${zoomedInner}
    <g data-step-goto="0" style="cursor:pointer;">
      <rect x="${W - 148}" y="20" width="122" height="26" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="${W - 87}" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">${window.svgAutoFormatText('⊞ 返回多图总览', 12.5)}</text>
    </g>
  </svg>`;
};

// 1. 顶部色彩图例条（纯 SVG 绘制，彻底杜绝 .visual svg 样式污染导致图标放大）
window.svgLegendBar = function(items, opts = {}) {
  const list = Array.isArray(items) ? items.filter(Boolean) : [];
  if (!list.length) return '';
  const x = opts.x !== undefined ? opts.x : 12;
  const y = opts.y !== undefined ? opts.y : 6;
  const w = opts.width || 516;
  const h = opts.height || 28;
  const cy = y + h / 2;
  const fs = opts.fontSize || 12.5;

  function estTextW(str) {
    let tw = 0;
    const s = String(str || '');
    for (let i = 0; i < s.length; i++) {
      tw += fs * (s.charCodeAt(i) > 127 ? 0.92 : 0.54);
    }
    return tw;
  }

  const measured = list.map(it => {
    const type = it.type || 'angle';
    const iconW = type === 'dash' ? 18 : (type === 'line' ? 16 : 15);
    const rawTxt = String(it.text || it.html || '').replace(/<[^>]+>/g, '');
    const tw = estTextW(rawTxt);
    return { it, type, iconW, rawTxt, tw, totalW: iconW + 4 + tw };
  });

  const gap = 16;
  const sumW = measured.reduce((acc, m) => acc + m.totalW, 0) + gap * (measured.length - 1);
  let curX = x + Math.max(8, (w - sumW) / 2);

  let out = `<g class="svg-legend-bar">`;
  out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="rgba(248,250,252,0.96)" stroke="#cbd5e1" stroke-width="1.2"/>`;

  measured.forEach((m, idx) => {
    const color = m.it.color || '#2563eb';
    if (m.type === 'angle') {
      out += `<path d="M ${(curX + 13).toFixed(1)} ${(cy + 5).toFixed(1)} L ${(curX + 1).toFixed(1)} ${(cy + 5).toFixed(1)} L ${(curX + 10).toFixed(1)} ${(cy - 5).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
      out += `<path d="M ${(curX + 8).toFixed(1)} ${(cy + 5).toFixed(1)} A 6.5 6.5 0 0 0 ${(curX + 6.3).toFixed(1)} ${(cy - 0.8).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    } else if (m.type === 'dash') {
      out += `<line x1="${curX.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(curX + 18).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${color}" stroke-width="2.4" stroke-dasharray="4 3" stroke-linecap="round"/>`;
    } else if (m.type === 'tri') {
      out += `<polygon points="${(curX + 7).toFixed(1)},${(cy - 5.5).toFixed(1)} ${(curX + 1).toFixed(1)},${(cy + 5).toFixed(1)} ${(curX + 13).toFixed(1)},${(cy + 5).toFixed(1)}" fill="${m.it.fill || 'rgba(234,88,12,0.22)'}" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`;
    } else {
      out += `<line x1="${curX.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(curX + 16).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>`;
    }
    const tx = curX + m.iconW + 4;
    const ty = cy + 4.5;
    if ((m.rawTxt.includes('≌') || m.rawTxt.includes('\\cong') || m.rawTxt.includes('\\frac') || m.rawTxt.includes('\\sqrt') || m.rawTxt.includes('√')) && window.MathFormula && typeof window.MathFormula.svgDirect === 'function') {
      out += window.MathFormula.svgDirect(tx, ty, m.rawTxt, { size: fs, color, halo: 0, anchor: 'start' });
    } else {
      out += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-family="'Times New Roman', 'Songti SC', SimSun, serif" font-weight="700" font-size="${fs}" fill="${color}" text-anchor="start">${window.svgAutoFormatText(m.rawTxt, fs)}</text>`;
    }
    curX += m.totalW + gap;
    if (idx < measured.length - 1) {
      const sepX = curX - gap / 2;
      out += `<line x1="${sepX.toFixed(1)}" y1="${(y + 6).toFixed(1)}" x2="${sepX.toFixed(1)}" y2="${(y + h - 6).toFixed(1)}" stroke="#cbd5e1" stroke-width="1.2"/>`;
    }
  });

  out += `</g>`;
  return out;
};

// 2. 数字角直观标注（支持同顶点阶梯半径与纯数字 1, 2, 3, 4, 5 标注，配角平分线引线防挤压）
window.svgNumberedAngle = function(v, pStart, pEnd, numStr, opts = {}) {
  const radius = opts.radius || 28;
  const color = opts.color || '#2563eb';
  const fill = opts.fill || 'none';
  const labelDist = opts.labelDist || (radius + 13);
  const dx1 = pStart[0] - v[0], dy1 = pStart[1] - v[1];
  const dx2 = pEnd[0] - v[0], dy2 = pEnd[1] - v[1];
  let a1 = Math.atan2(dy1, dx1);
  let a2 = Math.atan2(dy2, dx2);
  let diff = a2 - a1;
  while (diff <= -Math.PI) diff += Math.PI * 2;
  while (diff > Math.PI) diff -= Math.PI * 2;
  const sweep = diff > 0 ? 1 : 0;
  const sx = v[0] + Math.cos(a1) * radius;
  const sy = v[1] + Math.sin(a1) * radius;
  const ex = v[0] + Math.cos(a2) * radius;
  const ey = v[1] + Math.sin(a2) * radius;
  let out = '';
  if (fill && fill !== 'none') {
    out += `<path d="M ${v[0].toFixed(1)} ${v[1].toFixed(1)} L ${sx.toFixed(1)} ${sy.toFixed(1)} A ${radius} ${radius} 0 0 ${sweep} ${ex.toFixed(1)} ${ey.toFixed(1)} Z" fill="${fill}" stroke="none"/>`;
  }
  out += `<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${radius} ${radius} 0 0 ${sweep} ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${color}" stroke-width="2.1"/>`;
  if (numStr !== undefined && numStr !== null && String(numStr) !== '') {
    const midA = a1 + diff / 2 + (opts.angleShift || 0);
    const lx = v[0] + Math.cos(midA) * labelDist + (opts.dx || 0);
    const ly = v[1] + Math.sin(midA) * labelDist + 4.5 + (opts.dy || 0);
    if (opts.leader) {
      const mx = v[0] + Math.cos(midA) * (radius * 0.75);
      const my = v[1] + Math.sin(midA) * (radius * 0.75);
      const tx = v[0] + Math.cos(midA) * (labelDist - 7) + (opts.dx || 0);
      const ty = v[1] + Math.sin(midA) * (labelDist - 7) + (opts.dy || 0);
      out += `<line x1="${mx.toFixed(1)}" y1="${my.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${color}" stroke-width="1.3"/>`;
    }
    const inner = window.svgAutoFormatText(String(numStr), opts.fontSize || 14);
    out += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-family="'Times New Roman', 'Songti SC', SimSun, serif" font-weight="700" font-size="${opts.fontSize || 14}" fill="${color}" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${inner}</text>`;
  }
  return out;
};

function sampleHyperbola1(k, xStart, xEnd, ox, oy, scale, steps = 60) {
  const pts = [];

function normalizeSvgMathInRoot(root) {
  if (!root) return;
  root.querySelectorAll('svg text').forEach(textEl => {
    if (textEl.children.length > 0) return;
    const raw = textEl.textContent || '';
    if (!raw.trim()) return;
    const fs = parseFloat(textEl.getAttribute('font-size') || '14') || 14;
    textEl.setAttribute('font-style', 'normal');
    textEl.setAttribute('font-family', "'Times New Roman', 'Songti SC', 'SimSun', serif");
    textEl.innerHTML = window.svgAutoFormatText(raw, fs);
  });
  root.querySelectorAll('[data-ans]').forEach(el => {
    const ans = el.getAttribute('data-ans') || '';
    if (ans.includes('△') && !ans.includes('tri-sym')) {
      el.setAttribute('data-ans', ans.replace(/△/g, "<span class='tri-sym'>△</span>"));
    }
  });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.includes('△')) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (!p) return NodeFilter.FILTER_REJECT;
      if (p.classList && p.classList.contains('tri-sym')) return NodeFilter.FILTER_REJECT;
      if (p.closest('script, style')) return NodeFilter.FILTER_REJECT;
      if (p.closest('svg') && !p.closest('foreignObject')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const textNodes = [];
  let cur;
  while ((cur = walker.nextNode())) textNodes.push(cur);
  textNodes.forEach(tn => {
    const frag = document.createDocumentFragment();
    const parts = tn.nodeValue.split('△');
    parts.forEach((part, idx) => {
      if (part) frag.appendChild(document.createTextNode(part));
      if (idx < parts.length - 1) {
        const sp = document.createElement('span');
        sp.className = 'tri-sym';
        sp.textContent = '△';
        frag.appendChild(sp);
      }
    });
    tn.parentNode.replaceChild(frag, tn);
  });
  root.querySelectorAll('sub, sup').forEach(subEl => {
    const p = subEl.parentElement;
    if (!p || p.dataset.nowrapSub === '1' || p.classList.contains('screen-blank')) return;
    const prev = subEl.previousElementSibling;
    if (prev && prev.nextSibling === subEl && (prev.tagName === 'I' || prev.classList.contains('m') || prev.classList.contains('num'))) {
      const wrap = document.createElement('span');
      wrap.dataset.nowrapSub = '1';
      wrap.style.whiteSpace = 'nowrap';
      p.insertBefore(wrap, prev);
      wrap.appendChild(prev);
      wrap.appendChild(subEl);
      if (wrap.nextSibling && wrap.nextSibling.nodeType === 1 && (wrap.nextSibling.tagName === 'SUP' || wrap.nextSibling.tagName === 'SUB')) {
        wrap.appendChild(wrap.nextSibling);
      }
    }
  });
}

function runSimFn(fn, state, isInit) {
  if (!fn) return;
  window._blockSeq = 0;
  window._cellSeq = 0;
  window._blockMinSteps = {};
  if (typeof fn === 'function') {
    fn(state, isInit);
  } else if (fn && typeof fn.render === 'function') {
    if (isInit && typeof fn.init === 'function') fn.init(state);
    fn.render(state);
  }
  normalizeSvgMathInRoot(activeRoot());
}

function stepBar(step, maxStep = 3) {
  const s = Math.min(maxStep, Math.max(0, Number(step || 0)));
  const canReset = s > 0 || hasAnyManual(simState);
  const hasLab = Boolean(activeRoot() && activeRoot().querySelector('.screen-lab'));
  const isZoomed = document.body.classList.contains('canvas-zoom-mode');
  const dots = Array.from({ length: maxStep }, (_, i) => {
    const idx = i + 1;
    const cls = idx === s ? 'current' : (idx < s ? 'done' : '');
    return `<button type="button" class="step-dot-pill ${cls}" data-jump-step="${idx}" title="点击跳转至步骤 ${idx}">${idx}</button>`;
  }).join('');
  const hintTxt = s >= maxStep ? '✓ 已全部展开（答案已同步填入题干）' : '点击下方步骤卡片或按空格键逐步展开';
  const zoomBtnHTML = (hasLab && isZoomed)
    ? `<button type="button" class="step-btn zoom" onclick="window.toggleCanvasZoom(event)">🗗 退出全屏</button>`
    : '';
  return `<div class="step-ctrl-bar ${hasLab ? 'has-zoom' : ''}" data-max-step="${maxStep}">
    <div class="step-progress-group">

    </div>
    <div class="step-ghost-actions">
      <button type="button" class="step-btn prev" data-action="prevStep" ${s <= 0 ? 'disabled' : ''}>◀ 上一步</button>
      <button type="button" class="step-btn next" data-action="nextStep" ${s >= maxStep ? 'disabled' : ''}>下一步 ▸</button>
      <button type="button" class="step-btn all" data-action="completeTable" ${s >= maxStep ? 'disabled' : ''}>全部展开</button>
      <button type="button" class="step-btn rst" data-action="reset" ${!canReset ? 'disabled' : ''}>↺ 重置</button>
      ${zoomBtnHTML}
    </div>
  </div>`;
}

function stageBlock(minStep, currentStep, html, label) {

function cellReveal(minStep, currentStep, html, mask = '?') {

// 同步右侧笔记步骤、题干填空与结论框（严格限定在 #content 内，避免翻页动画残留节点干扰）
function syncSlideProgression(state) {
  const root = activeRoot();
  let highestManual = 0;
  if (state && state.manualNotes) {
    Object.keys(state.manualNotes).forEach(k => {
      if (state.manualNotes[k]) highestManual = Math.max(highestManual, Number(k) + 1);
    });
  }
  const s = Math.max(Number(state.step || 0), highestManual);
  const barEl = root.querySelector('.step-ctrl-bar');
  const noteSteps = root.querySelectorAll('.screen-notes > .step, .screen-notes .step');
  const maxStep = barEl ? Number(barEl.dataset.maxStep || Math.max(3, noteSteps.length)) : Math.max(3, noteSteps.length);

  // 0. 定理页画布顶部对齐，避免分步展开时上下跳动
  const canvasInner = root.querySelector('.screen-canvas > div');
  if (canvasInner && canvasInner.style && canvasInner.style.justifyContent === 'center') {
    canvasInner.style.justifyContent = 'flex-start';
    canvasInner.style.paddingTop = '8px';
  }

  // 1. 同步题干中的 .screen-blank 填空与选择题括号答案
  const allBlanks = root.querySelectorAll('.screen-stem .screen-blank[data-ans]');
  const totalBlanks = allBlanks.length;
  allBlanks.forEach((blank, idx) => {
    const unlockAt = blank.dataset.step
      ? Number(blank.dataset.step)
      : (totalBlanks <= 1 ? maxStep : Math.max(1, Math.ceil((idx + 1) * maxStep / totalBlanks)));
    if (s >= unlockAt) {
      blank.innerHTML = blank.dataset.ans;
      blank.classList.add('filled');
    } else if (!blank.dataset.manualFill) {
      blank.innerHTML = '';
      blank.classList.remove('filled');
    }
  });

  // 2. 同步右侧 .screen-notes > .step（保留真实知识点标题，支持直接点击步骤卡片推进步骤与动态图，支持单卡片多子步 data-step-start/end 与 .step-sub-part）
  let foundNextLocked = false;
  noteSteps.forEach((stepEl, idx) => {
    const startS = Number(stepEl.dataset.stepStart || (idx + 1));
    const endS = Number(stepEl.dataset.stepEnd || startS);
    const isManualNote = Boolean(state.manualNotes && state.manualNotes[idx]);
    const spanEl = stepEl.querySelector('span');
    const rawTxt = spanEl ? spanEl.textContent.trim() : '';
    const topicTitle = /[:：]/.test(rawTxt) ? rawTxt.split(/[:：]/)[0].trim() : `步骤 ${idx + 1}`;
    stepEl.querySelectorAll('.step-sub-part[data-sub-step]').forEach(part => {
      const subReq = Number(part.dataset.subStep || endS);
      if (s >= subReq) {
        part.classList.remove('sub-step-locked');
      } else {
        part.classList.add('sub-step-locked');
        if (!part.dataset.subHint) {
          part.dataset.subHint = '点击继续展开下一空 ▸';
        }
      }
    });
    if (isManualNote || s >= startS) {
      stepEl.classList.remove('step-locked', 'step-next-up');
      stepEl.classList.toggle('step-active', (s >= startS && s <= endS) || isManualNote);
      stepEl.dataset.lockMsg = `${topicTitle}`;
      if (s >= startS && s < endS) {
        foundNextLocked = true;
      }
    } else {
      stepEl.classList.add('step-locked');
      stepEl.classList.remove('step-active');
      if (!foundNextLocked) {
        foundNextLocked = true;
        stepEl.classList.add('step-next-up');
        stepEl.dataset.lockMsg = `${topicTitle}  ·  点击展开下一步 ▸`;
      } else {
        stepEl.classList.remove('step-next-up');
        stepEl.dataset.lockMsg = `${topicTitle}  ·  点击展开 ▸`;
      }
    }
    stepEl.onclick = e => {
      if (e && e.stopPropagation) e.stopPropagation();
      const curS = Number(state.step || 0);
      if (curS < startS) {
        state.step = startS;
      } else if (curS >= startS && curS < endS) {
        state.step = curS + 1;
      } else {
        state.step = startS;
      }
      state.manualOverrides = {};
      if (state.manualNotes) {
        Object.keys(state.manualNotes).forEach(k => {
          if (Number(k) > idx) delete state.manualNotes[k];
        });
      }
      if (currentSimType && ALL_SIMS[currentSimType]) {
        runSimFn(ALL_SIMS[currentSimType], state, false);
      }
      syncSlideProgression(state);
      if (currentSimType) bindSimControls(currentSimType);
    };
  });
  normalizeSvgMathInRoot(root);

  // 3. 同步底部结论框 .answer 与自动视口滚动对齐
  const ansBox = root.querySelector('.screen-notes .answer');
  const revBtn = root.querySelector('.screen-notes [data-reveal]');
  if (ansBox) {
    if (s >= maxStep) {
      ansBox.hidden = false;
      if (revBtn) revBtn.setAttribute('aria-expanded', 'true');
    } else if (s === 0 && !hasAnyManual(state)) {
      ansBox.hidden = true;
      if (revBtn) revBtn.setAttribute('aria-expanded', 'false');
    }
  }
  const sn = root.querySelector('.screen-notes');
  if (sn) {
    if ((s === 0 && !hasAnyManual(state)) || maxStep <= 2) {
      sn.scrollTop = 0;
    } else {
      const activeEl = sn.querySelector('.step.step-active');
      if (activeEl && sn.scrollHeight > sn.clientHeight + 4) {
        const elBottom = activeEl.offsetTop + activeEl.offsetHeight;
        if (elBottom > sn.scrollTop + sn.clientHeight) {
          sn.scrollTop = Math.max(0, elBottom - sn.clientHeight + 8);
        } else if (activeEl.offsetTop < sn.scrollTop) {
          sn.scrollTop = Math.max(0, activeEl.offsetTop - 8);
        }
      }
    }
  }
}

document.addEventListener('click', e => {

  const chip = e.target.closest('.cond-chip');

  const cloze = e.target.closest('.cloze');
  if (cloze && !cloze.hasAttribute('onclick')) cloze.classList.toggle('revealed');
});

window.revealAllClozeInSlide = function(btn) {

function fmtBadgeText(str) {
  return String(str || '').replace(/\s+/g, '').replace(/([0-9A-Za-z·]+)/g, '<span class="num">$1</span>');
}

function isPureTitleBar(el) {
  if (!el || el.tagName !== 'DIV') return false;
  const st = (el.getAttribute && el.getAttribute('style')) || '';
  if (/display\s*:\s*(?:grid|flex)/i.test(st)) return false;
  const hasBlockChild = Array.from(el.children || []).some(c => ['DIV', 'TABLE', 'UL', 'OL'].includes(c.tagName));
  if (hasBlockChild) return false;
  const txt = (el.textContent || '').trim();
  return txt.endsWith('：') || txt.endsWith(':') || txt.length <= 42;
}

function getAtomicProbNodes(vb) {
  if (!vb) return [];
  const firstEl = vb.firstElementChild;
  if (!firstEl) return [];
  if (firstEl.tagName === 'TABLE') {
    const rows = [];
    if (firstEl.querySelector('tbody')) rows.push(...Array.from(firstEl.querySelector('tbody').children));
    if (firstEl.querySelector('tfoot')) rows.push(...Array.from(firstEl.querySelector('tfoot').children));
    return rows;
  }
  const topChildren = (firstEl.children && firstEl.children.length >= 2)
    ? Array.from(firstEl.children)
    : (vb.children.length >= 2 ? Array.from(vb.children) : [firstEl]);
  const nodes = [];

  function collectFromBlock(ch) {
    if (!ch) return;
    const st = (ch.getAttribute && ch.getAttribute('style')) || '';
    if (ch.tagName === 'TABLE') {
      if (ch.querySelector('tbody')) nodes.push(...Array.from(ch.querySelector('tbody').children));
      if (ch.querySelector('tfoot')) nodes.push(...Array.from(ch.querySelector('tfoot').children));
      return;
    }
    if (ch.children && ch.children.length >= 2 && /display\s*:\s*grid/i.test(st)) {
      Array.from(ch.children).forEach(col => nodes.push(col));
      return;
    }
    // 若容器内部嵌套了 grid 或 table（例如：顶部一行小标题 + 中间4列胶囊网格 + 底部汇总行），保持顶部标题常驻可见，仅将其中的网格卡片与汇总行拆为独立可点单元
    const innerKids = Array.from(ch.children || []);
    const hasNestedGridOrTable = innerKids.some(k => {
      const kst = (k.getAttribute && k.getAttribute('style')) || '';
      return k.tagName === 'TABLE' || (/display\s*:\s*grid/i.test(kst) && k.children.length >= 2);
    });
    if (hasNestedGridOrTable && innerKids.length >= 2) {
      innerKids.forEach((k, kIdx) => {
        if (kIdx === 0 && isPureTitleBar(k)) {
          return; // 保持分区小标题常驻可见，不遮罩
        }
        collectFromBlock(k);
      });
      return;
    }
    nodes.push(ch);
  }

  topChildren.forEach((ch, idx) => {
    if (idx === 0 && isPureTitleBar(ch) && topChildren.length >= 2) {
      return;
    }
    collectFromBlock(ch);
  });
  return nodes;
}

function extractCleanNodeLabel(node, idx) {
  if (!node) return `步骤 ${idx + 1}`;
  const firstChild = node.firstElementChild;
  const hasBlockFirst = firstChild && ['DIV', 'P', 'H3', 'H4', 'HEADER'].includes(firstChild.tagName);
  let raw = (hasBlockFirst ? firstChild.textContent : node.textContent) || '';
  raw = raw.replace(/\s+/g, ' ').trim();
  raw = raw.replace(/^[✓✗✔✘•·]+\s*/, '').replace(/[（(](?:正确|错误|已配平|缺\d+)[)）]/g, '').trim();
  if (hasBlockFirst && firstChild.querySelector && firstChild.querySelector('sup') && /^[0-9]+$/.test(raw) && raw.length <= 3) {
    const clone = firstChild.cloneNode(true);
    clone.querySelectorAll('sup, sub').forEach(el => el.remove());
    const baseText = (clone.textContent || raw[0]).trim();
    return `质因数 ${baseText}  ·  展开 ▸`;
  }
  const colonIdx = raw.search(/[：:]/);
  const eqIdx = raw.indexOf('=');
  if (colonIdx > 0 && (eqIdx < 0 || colonIdx < eqIdx)) {
    const parts = raw.split(/[：:]/);
    const left = parts[0].trim();
    const right = (parts[1] || '').trim();
    if (left.length >= 2 && left.length <= 18) {
      raw = (left.startsWith('筛网') && right) ? `${left}（${right.split(/[（(，,]/)[0]}）` : left;
    }
  } else if (eqIdx > 0) {
    const lhs = raw.split('=')[0].trim();
    if (lhs.length >= 2 && lhs.length <= 24) raw = lhs;
  } else if (raw.includes('⇒')) {
    const lhs = raw.split('⇒')[0].trim();
    if (lhs.length >= 2) raw = lhs;
  }
  if (raw.length > 22) raw = raw.slice(0, 20) + '…';
  return raw ? `${raw}  ·  展开 ▸` : `模块 ${idx + 1}  ·  展开 ▸`;
}

const PROBLEM_SIMS = {};

// 将 unit1_slides.js / unit2_slides.js / unit3_slides.js 中的 26 道例题与随堂演练转换为分步渐进式互动页
function convertProblemToPPTSlide(p, probIdx) {
  const letters = 'ABCDEF';
  const normOpts = (p.options || []).map((o, idx) => {
    if (typeof o === 'string') {
      const m = o.match(/^\(([A-F])\)\s*(.*)$/);
      return m ? { label: m[1], text: m[2] } : { label: letters[idx] || '?', text: o };
    }
    return { label: o.label || letters[idx], text: o.text || o.html || '' };
  });
  const correctIdx = Math.max(0, normOpts.findIndex(o => o.label === p.answer));
  const isPrac = (p.subType === 'practice' || (p.badge && p.badge.startsWith('练')));
  const phase = isPrac ? 3 : 2;
  const srcFormatted = fmtBadgeText(p.source || p.badge);
  const badgeFormatted = fmtBadgeText(p.badge);
  const section = isPrac ? `随堂演练 · 实战冲刺（${srcFormatted}）` : `真题精讲 · 典例剖析（${srcFormatted}）`;
  const cleanTitle = p.title || `${badgeFormatted} · 真题精讲`;
  const simName = `probSim_${probIdx}`;

  const hasLongOpt = normOpts.some(o => String(o.text || '').replace(/<[^>]*>/g, '').trim().length > 9);
  const quizHTML = `<div class="quiz prob-quiz-grid ${hasLongOpt ? 'quiz-3col' : ''}" data-correct="${correctIdx}">${normOpts.map((o, i) => `<button type="button" class="option" data-option="${i}"><b>${o.label}</b><span>${o.text}</span></button>`).join('')}</div><div class="feedback" aria-live="polite" data-explain="✅正确答案：${p.answer}。"></div>`;

  const stepsHTML = (p.steps || []).map((st, idx) => `
    <div class="prob-step-card step-locked" data-step-idx="${idx + 1}" style="border-left-color:${st.tagColor || '#304580'}">
      <div class="prob-step-head">
        <span class="prob-step-tag" style="background:${st.tagColor || '#304580'}">${st.tag || ('步骤'+(idx+1))}</span>
        <span class="prob-step-title">${st.title || ''}</span>
      </div>
      <div class="prob-step-math">${st.mathHTML || st.descHTML || ''}</div>
    </div>
  `).join('');

  const cleanSummary = (p.summaryHTML || '').replace(/^\s*(?:<(?:b|strong)>)?\s*核心心法[：:]?\s*(?:<\/(?:b|strong)>)?\s*/i, '');
  const cleanVisTitle = (p.visualTitle || '解题图解').replace(/^直观图解[：:]\s*/, '');

  const html = `
    <div class="screen-page lab-visible">
      <div class="screen-stem">
        <p><span class="prob-badge ${isPrac ? 'practice' : ''}">${badgeFormatted}</span><span class="prob-source">【${srcFormatted}】</span>${p.stemHTML}</p>
      </div>
      <div class="screen-lower">
        <div class="screen-media">
          <div class="prob-visual-card">
            <div class="prob-visual-head">
              <span>📊 ${cleanVisTitle}</span>
            </div>
            <div class="prob-visual-body" id="probVisualBody">${p.visualHTML || ''}</div>
            ${cleanSummary ? `<div class="prob-summary-box" id="probSummaryBox" style="display:none;">💡<b>方法总结：</b>${cleanSummary}</div>` : ''}
          </div>
        </div>
        <div class="screen-notes">
          <div id="controls" class="controls"></div>
          ${quizHTML}
          ${stepsHTML}
        </div>
      </div>
    </div>
  `;

  PROBLEM_SIMS[simName] = function(state, isInit) {
    if (isInit) {
      state.step = 0;
      clearManualOverrides(state);
    }
    const root = activeRoot();
    const step = Number(state.step || 0);
    const vb = root.querySelector('#probVisualBody');
    const sb = root.querySelector('#probSummaryBox');

    const stageNodes = getAtomicProbNodes(vb);
    const totalNodes = stageNodes.length;
    const totalSteps = (p.steps || []).length;
    const dynMaxStep = Math.max(2, totalSteps, totalNodes);

    const controls = root.querySelector('#controls');
    if (controls) {
      controls.innerHTML = stepBar(step, dynMaxStep);
    }

    const stemChips = Array.from(root.querySelectorAll('.screen-stem .cond-chip'));
    if (step > 0) {
      stemChips.forEach(c => c.classList.add('unlocked'));
    }

    // 左侧解题示意图：保留分区标题与表头，每个具体分栏原位1对1简洁遮罩
    if (vb && totalNodes >= 1) {
      vb.style.display = 'flex';
      stageNodes.forEach((node, idx) => {
        const isUnlocked = Boolean(
          (state.manualProbNodes && state.manualProbNodes[idx]) ||
          step >= idx + 1 ||
          step >= dynMaxStep
        );
        node.classList.remove('stage-node-hidden');
        if (node.tagName === 'TR') {
          node.classList.toggle('prob-tr-masked', !isUnlocked);
        } else {
          node.classList.toggle('prob-node-masked', !isUnlocked);
          if (!node.dataset.lockLabel) {
            node.dataset.lockLabel = extractCleanNodeLabel(node, idx);
          }
        }
        node.onclick = e => {
          if (node.classList.contains('prob-node-masked') || node.classList.contains('prob-tr-masked')) {
            e.stopPropagation();
            if (!state.manualProbNodes) state.manualProbNodes = {};
            state.manualProbNodes[idx] = true;
            runSimFn(PROBLEM_SIMS[simName], state, false);
            syncSlideProgression(state);
            bindSimControls(simName);
          }
        };
      });
    }

    if (sb) {
      sb.style.display = step >= dynMaxStep ? 'block' : 'none';
    }

    // 全部展开或推演至最后一步时，自动在选项栏高亮正确选项；重置时恢复初始态
    const quizBox = root.querySelector('.prob-quiz-grid');
    const fbBox = root.querySelector('.screen-notes .feedback');
    if (quizBox) {
      if (step >= dynMaxStep) {
        const rightOpt = quizBox.querySelector(`[data-option="${correctIdx}"]`);
        if (rightOpt) rightOpt.classList.add('correct');
      } else if (step === 0 && !hasAnyManual(state)) {
        quizBox.querySelectorAll('.option').forEach(el => el.classList.remove('correct', 'wrong'));
        if (fbBox) fbBox.textContent = '';
      }
    }

    // 同步右侧 .prob-step-card 分步推导卡片（未展开时点击展开卡片，已展开时再次点击直接揭晓卡片内的蓝色算式）
    const stepCards = root.querySelectorAll('.screen-notes .prob-step-card');
    let foundNextProbLocked = false;
    stepCards.forEach((card, idx) => {
      const reqStep = totalSteps > 0 ? Math.max(1, Math.round((idx + 1) * dynMaxStep / totalSteps)) : (idx + 1);
      const isManualCard = Boolean(state.manualNotes && state.manualNotes[idx]);
      if (isManualCard || step >= idx + 1 || step >= dynMaxStep) {
        card.classList.remove('step-locked', 'step-next-up');
        card.querySelectorAll('.cloze').forEach(c => {
          if (step >= dynMaxStep) {
            c.classList.add('revealed');
          }
        });
      } else {
        card.classList.add('step-locked');
        if (!foundNextProbLocked) {
          foundNextProbLocked = true;
          card.classList.add('step-next-up');
        } else {
          card.classList.remove('step-next-up');
        }
        card.querySelectorAll('.cloze').forEach(c => c.classList.remove('revealed'));
      }
      card.onclick = e => {
        if (card.classList.contains('step-locked')) {
          e.stopPropagation();
          state.step = Math.max(Number(state.step || 0), reqStep);
          if (!state.manualNotes) state.manualNotes = {};
          state.manualNotes[idx] = true;
          runSimFn(PROBLEM_SIMS[simName], state, false);
          syncSlideProgression(state);
          bindSimControls(simName);
        } else if (!e.target.closest('.cloze')) {
          card.querySelectorAll('.cloze').forEach(c => c.classList.add('revealed'));
        }
      };
    });
  };

  return {
    lesson: p.unit || 1,
    phase: phase,
    navTag: badgeFormatted,
    section: section,
    title: cleanTitle,
    cover: false,
    sim: simName,
    html: html
  };
}

let globalProbCounter = 1;
const u1Probs = (window.UNIT1_SLIDES || []).filter(s => s.stemHTML).map(p => convertProblemToPPTSlide(p, globalProbCounter++));
const u2Probs = (window.UNIT2_SLIDES || []).filter(s => s.stemHTML).map(p => convertProblemToPPTSlide(p, globalProbCounter++));
const u3Probs = (window.UNIT3_SLIDES || []).filter(s => s.stemHTML).map(p => convertProblemToPPTSlide(p, globalProbCounter++));

const slides = [
  ...(window.UNIT1_THEOREM_SLIDES || []),
  ...u1Probs,
  ...(window.UNIT2_THEOREM_SLIDES || []),
  ...u2Probs,
  ...(window.UNIT3_THEOREM_SLIDES || []),
  ...u3Probs,
  ...(window.UNIT3_SUMMARY_SLIDE ? [window.UNIT3_SUMMARY_SLIDE] : [])
];

const ALL_SIMS = Object.assign(
  {},
  window.UNIT1_SIMS || {},
  window.UNIT2_SIMS || {},
  window.UNIT3_SIMS || {},
  PROBLEM_SIMS
);

function initSim(type){
  currentSimType = type;
  simState = { step: 0, mode: 0, action: 'm0', manualBlocks: {}, manualCells: {}, manualNotes: {}, manualProbNodes: {}, manualOverrides: {} };
  const fn = ALL_SIMS[type];
  if (!fn) return;
  runSimFn(fn, simState, true);
  syncSlideProgression(simState);
  bindSimControls(type);
}

function bindSimControls(type){
  const fn = ALL_SIMS[type];
  if (!fn) return;
  const root = activeRoot();
  const ctrlBox = root.querySelector('#controls');
  if (!ctrlBox) return;

  ctrlBox.querySelectorAll('input[type="range"]').forEach(inp => {
    inp.oninput = e => {
      const k = e.target.dataset.key;
      simState[k] = isNaN(+e.target.value) ? e.target.value : +e.target.value;
      if (typeof setManualOverride === 'function') setManualOverride(simState, k);
      const out = ctrlBox.querySelector(`output[data-value="${k}"]`);
      if (out) {
        const nv = Number(e.target.value);
        out.textContent = (!isNaN(nv) && !Number.isInteger(nv)) ? nv.toFixed(2) : e.target.value;
      }
      // 拖动滑块时屏蔽 controls.innerHTML 重建，保持滑块焦点不断连
      Object.defineProperty(ctrlBox, 'innerHTML', {
        configurable: true,
        get() { return ''; },
        set() {}
      });
      try {
        runSimFn(fn, simState, false);
      } finally {
        delete ctrlBox.innerHTML;
      }
    };
    inp.onchange = () => {
      runSimFn(fn, simState, false);
      syncSlideProgression(simState);
      bindSimControls(type);
    };
  });

  ctrlBox.querySelectorAll('select').forEach(sel => {
    sel.onchange = e => {
      const k = e.target.dataset.key;
      simState[k] = e.target.value;
      if (typeof setManualOverride === 'function') setManualOverride(simState, k);
      runSimFn(fn, simState, false);
      syncSlideProgression(simState);
      bindSimControls(type);
    };
  });

  ctrlBox.querySelectorAll('[data-jump-step]').forEach(dot => {
    dot.onclick = e => {
      e.stopPropagation();
      const targetS = Number(dot.dataset.jumpStep || 1);
      simState.step = targetS;
      simState.manualOverrides = {};
      if (simState.manualNotes) {
        Object.keys(simState.manualNotes).forEach(k => {
          if (Number(k) + 1 > targetS) delete simState.manualNotes[k];
        });
      }
      runSimFn(fn, simState, false);
      syncSlideProgression(simState);
      bindSimControls(type);
    };
  });

  ctrlBox.querySelectorAll('[data-mode-key]').forEach(mBtn => {
    mBtn.onclick = e => {
      e.stopPropagation();
      const k = mBtn.dataset.modeKey;
      const v = mBtn.dataset.modeVal;
      simState[k] = (typeof simState[k] === 'number') ? (isNaN(+v) ? v : +v) : v;
      if (mBtn.dataset.syncStep !== undefined) {
        simState.step = Math.max(Number(simState.step || 0), Number(mBtn.dataset.syncStep));
      }
      if (typeof setManualOverride === 'function') setManualOverride(simState, k);
      runSimFn(fn, simState, false);
      syncSlideProgression(simState);
      bindSimControls(type);
    };
  });

  const actBtns = ctrlBox.querySelectorAll('[data-action]');
  actBtns.forEach(btn => {
    const act = btn.dataset.action;
    if (/^m\d+$/.test(act)) {
      btn.classList.toggle('active-act', act === (simState.action || 'm0'));
    }
    btn.onclick = e => {
      e.stopPropagation();
      const barEl = ctrlBox.querySelector('.step-ctrl-bar');
      const maxStep = barEl ? Number(barEl.dataset.maxStep || 3) : 3;
      if (act === 'nextStep') {
        let nextS = Math.min(maxStep, Number(simState.step || 0) + 1);
        while (nextS < maxStep) {
          const bKeys = Object.keys(window._blockMinSteps || {}).filter(k => window._blockMinSteps[k] === nextS);
          const allBManual = bKeys.length > 0 && bKeys.every(k => simState.manualBlocks && simState.manualBlocks[k]);
          const pManual = Boolean(simState.manualProbNodes && simState.manualProbNodes[nextS - 1]);
          if (allBManual || pManual) {
            nextS++;
          } else {
            break;
          }
        }
        simState.step = nextS;
        simState.manualOverrides = {};
      } else if (act === 'prevStep') {
        const prevS = Math.max(0, Number(simState.step || 0) - 1);
        simState.step = prevS;
        simState.manualOverrides = {};
        if (simState.manualBlocks) {
          Object.keys(simState.manualBlocks).forEach(k => {
            if ((window._blockMinSteps[k] || 99) > prevS) delete simState.manualBlocks[k];
          });
        }
        if (simState.manualProbNodes) {
          Object.keys(simState.manualProbNodes).forEach(k => {
            if (Number(k) + 1 > prevS) delete simState.manualProbNodes[k];
          });
        }
        if (simState.manualNotes) {
          Object.keys(simState.manualNotes).forEach(k => {
            if (Number(k) + 1 > prevS) delete simState.manualNotes[k];
          });
        }
      } else if (act === 'completeTable') {
        simState.step = maxStep;
        simState.manualOverrides = {};
      } else if (act === 'reset') {
        simState.step = 0;
        clearManualOverrides(simState);
        root.querySelectorAll('.screen-stem .screen-blank').forEach(b => { b.dataset.manualFill = ''; });
      } else {
        simState.action = act;
      }
      runSimFn(fn, simState, false);
      syncSlideProgression(simState);
      bindSimControls(type);
    };
  });
}

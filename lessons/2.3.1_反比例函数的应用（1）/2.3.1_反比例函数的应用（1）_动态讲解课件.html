  if (action === 'next' && (key === 'Space' || key === 'Enter')) {
    const root = activeRoot();
    const barEl = root && root.querySelector('.step-ctrl-bar');
    if (barEl && currentSimType && ALL_SIMS[currentSimType]) {
      const maxStep = Number(barEl.dataset.maxStep || 3);
      const curStep = Number(simState.step || 0);
      if (curStep < maxStep) {
        window.advanceSimStep(curStep + 1);
        return;
      }
    }
  }
  if(action==='prev')go(index-1);
  if(action==='next')go(index+1);
  if(action==='clear'){const hasInk=inkPage().strokes.length>0;clearPen();toast(hasInk?'已清空本页批注，可在批注工具中撤销':'本页没有批注')}
  if(action==='fullscreen')$('#fullscreen').click();
}
document.addEventListener('keydown',e=>{
 if(e.isComposing)return;const key=remoteKey(e);
 if($('#remoteDialog').open){
  if(!learningAction)return;
  e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;
  if(e.key==='Escape'){learningAction=null;showRemoteBindings();$('#remoteStatus').textContent='已取消本次绑定。';return}
  if(['Control','Shift','Alt','Meta','Unidentified',''].includes(e.key)||key==='Unidentified')return;
  const action=learningAction,duplicate=Object.entries(remoteBindings).find(([a,k])=>a!==action&&k===key);
  if(duplicate){$('#remoteStatus').textContent=`此按键已绑定“${remoteActions[duplicate[0]]}”。请换一个按键，或先恢复默认。`;return}
  remoteBindings[action]=key;learningAction=null;const saved=remoteSave();showRemoteBindings();$('#remoteStatus').textContent=`“${remoteKeyLabel(key)}”已绑定“${remoteActions[action]}”。${saved?'设置已保存在当前浏览器。':'本次打开课件期间有效。'}`;return;
 }
 if($('#tocDialog').open||$('#imageDialog').open||$('#transitionDialog').open||drawing)return;
 const focused=document.activeElement,editing=['INPUT','SELECT','TEXTAREA'].includes(focused.tagName)||focused.isContentEditable;
 if(editing&&!['PageUp','PageDown','F5'].includes(e.code))return;
 let action=Object.entries(remoteBindings).find(([,k])=>k===key)?.[0];
 if(!action)action=Object.keys(remoteDefaults).find(a=>!remoteBindings[a]&&remoteDefaults[a].includes(key));
 if(action){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)runRemoteAction(action, key);return}
 if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(slides.length-1)}if(e.key.toLowerCase()==='m')$('#toc').click();
},true);

const transitionChoices={none:['极速翻页（推荐）','零延迟瞬时切换，彻底消除大屏翻页卡顿。'],fade:['柔和渐显','轻柔交替，适合连续讲解与练习。'],smart:['主题联动','普通翻页使用立体翻书，进入新环节时由光束揭幕。'],book:['立体翻书','纸页绕边缘翻转，光影随页面转动。'],beam:['光影扫幕','一束暖光扫过画面，逐渐揭开下一页。'],space:['空间旋转','页面沿空间转动，前后方向相互对应。']};
const transitionSettings={effect:'none',duration:420};
try{const saved=JSON.parse(localStorage.getItem('projection-transitions-v2')||'{}');if(Object.hasOwn(transitionChoices,saved.effect))transitionSettings.effect=saved.effect;if([420,650,900].includes(saved.duration))transitionSettings.duration=saved.duration}catch(e){}
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let transitionRun=null,transitionSerial=0;
function saveTransitionSettings(){try{localStorage.setItem('projection-transitions-v2',JSON.stringify(transitionSettings))}catch(e){}}
function updateTransitionChoices(){
 $('#transitionChoices').innerHTML=Object.entries(transitionChoices).map(([key,[name,description]])=>`<button data-effect="${key}" class="effect-choice ${transitionSettings.effect===key?'selected':''}" aria-pressed="${transitionSettings.effect===key}"><span class="effect-mini effect-${key}" aria-hidden="true"><i></i><i></i></span><span><b>${name}</b><small>${description}</small></span><em>${transitionSettings.effect===key?'已选':'选择'}</em></button>`).join('');
 $('#transitionSpeed').value=transitionSettings.duration;$('#transitionMotionNote').hidden=!reducedMotion.matches;
}
$('#effects').onclick=()=>{stopSlideTransition();updateTransitionChoices();$('#transitionDialog').showModal()};
$('#transitionClose').onclick=()=>$('#transitionDialog').close();
$('#transitionChoices').onclick=e=>{const b=e.target.closest('[data-effect]');if(!b)return;transitionSettings.effect=b.dataset.effect;saveTransitionSettings();updateTransitionChoices()};
$('#transitionSpeed').onchange=e=>{transitionSettings.duration=+e.target.value;saveTransitionSettings()};
$('#transitionPreview').onclick=()=>{$('#transitionDialog').close();const effect=transitionSettings.effect==='smart'?'beam':transitionSettings.effect;animateSlideChange(()=>{},1,effect)};
function stopSlideTransition(){if(!transitionRun)return;const run=transitionRun;transitionRun=null;run.animations.forEach(a=>a.cancel());run.layer.remove();$('#stage').classList.remove('transitioning');$('#penLayer').style.visibility='';$('#content').style.transformOrigin='';}
function transitionSnapshot(){
 const sheet=document.createElement('div');sheet.className='transition-sheet';sheet.inert=true;sheet.setAttribute('aria-hidden','true');
 const copy=$('#content').cloneNode(true),mapping=new Map();
 copy.querySelectorAll('[id]').forEach(el=>{const id=el.id,next='fx'+transitionSerial+'-'+id;mapping.set(id,next);el.id=next});copy.removeAttribute('id');
 copy.querySelectorAll('*').forEach(el=>{for(const a of [...el.attributes]){if(a.name==='aria-live'||(a.name.startsWith('data-')&&a.name!=='data-lock-msg'&&a.name!=='data-lock-label'))el.removeAttribute(a.name);if(a.value.includes('url(#'))el.setAttribute(a.name,a.value.replace(/url\(#([^)]*)\)/g,(m,id)=>mapping.has(id)?`url(#${mapping.get(id)})`:m));if(['href','xlink:href'].includes(a.name)&&a.value.startsWith('#')&&mapping.has(a.value.slice(1)))el.setAttribute(a.name,'#'+mapping.get(a.value.slice(1)))}});
 copy.querySelectorAll('.slide').forEach(el=>el.style.animation='none');sheet.append(copy);
 if(inkPage().strokes.length){const ink=document.createElement('canvas');ink.width=canvas.width;ink.height=canvas.height;ink.className='transition-ink';ink.getContext('2d').drawImage(canvas,0,0);sheet.append(ink);}return sheet;
}
function animateSlideChange(change,direction,effect){
 stopSlideTransition();
 if(effect==='none'||reducedMotion.matches||!Element.prototype.animate){change();return}
 const serial=++transitionSerial,layer=document.createElement('div');layer.className='transition-layer';layer.inert=true;layer.setAttribute('aria-hidden','true');
 const old=transitionSnapshot();layer.append(old);$('#stage').append(layer);
 try{change();}catch(err){console.error(err);layer.remove();return;}
 const live=$('#content'),width=$('#stage').clientWidth,d=direction>=0?1:-1,duration=transitionSettings.duration,ease='cubic-bezier(.23,.73,.18,1)';
 $('#stage').classList.add('transitioning');$('#penLayer').style.visibility='hidden';
 const animations=[],play=(el,frames,options={})=>{const a=el.animate(frames,{duration,easing:ease,fill:'both',...options});animations.push(a);return a};
 if(effect==='book'){
  old.style.transformOrigin=d>0?'0% 50%':'100% 50%';old.classList.add('paper-turn');
  play(old,[{transform:'perspective(2200px) rotateY(0deg)',opacity:1,filter:'brightness(1)'},{transform:`perspective(2200px) rotateY(${-d*55}deg)`,opacity:1,filter:'brightness(.80)',offset:.58},{transform:`perspective(2200px) rotateY(${-d*105}deg)`,opacity:0,filter:'brightness(.66)'}]);
  play(live,[{transform:`perspective(2200px) translateX(${d*width*.05}px) rotateY(${d*9}deg)`,filter:'brightness(.88)'},{transform:'perspective(2200px) translateX(0) rotateY(0)',filter:'brightness(1)'}]);
 }else if(effect==='beam'){
  play(old,[{opacity:1},{opacity:0,offset:.72},{opacity:0}]);
  const clip=d>0?'inset(0 100% 0 0)':'inset(0 0 0 100%)';
  play(live,[{clipPath:clip,filter:'brightness(1.12)'},{clipPath:'inset(0 0% 0 0%)',filter:'brightness(1)'}]);
  const beam=document.createElement('div');beam.className='transition-beam';layer.append(beam);play(beam,[{transform:`translateX(${d>0?-280:width+50}px) skewX(-14deg)`,opacity:0},{opacity:.9,offset:.2},{opacity:.7,offset:.75},{transform:`translateX(${d>0?width+150:-300}px) skewX(-14deg)`,opacity:0}],{easing:'cubic-bezier(.35,.05,.25,1)'});
 }else if(effect==='space'){
  old.style.transformOrigin=d>0?'0% 50%':'100% 50%';
  play(old,[{transform:'perspective(2400px) translateX(0) rotateY(0deg)',opacity:1},{transform:`perspective(2400px) translateX(${-d*width*.55}px) rotateY(${-d*65}deg)`,opacity:0}]);
  live.style.transformOrigin=d>0?'100% 50%':'0% 50%';
  play(live,[{transform:`perspective(2400px) translateX(${d*width*.55}px) rotateY(${d*65}deg)`,opacity:0},{transform:'perspective(2400px) translateX(0) rotateY(0deg)',opacity:1}]);
 }else{
  play(old,[{opacity:1},{opacity:0}]);play(live,[{opacity:0,transform:`translateY(${12*d}px)`},{opacity:1,transform:'translateY(0)'}]);
 }
 transitionRun={serial,layer,animations};
 Promise.allSettled(animations.map(a=>a.finished)).then(()=>{if(transitionRun?.serial!==serial)return;stopSlideTransition()});
}
function transitionNavigate(n){
 const target=Math.max(0,Math.min(slides.length-1,n));if(target===index)return;
 const from=slides[index],to=slides[target],direction=target>index?1:-1;
 let effect=transitionSettings.effect;if(effect==='smart')effect=from.lesson!==to.lesson||phaseOf(from)!==phaseOf(to)?'beam':'book';
 if(innerWidth<=700&&['book','space'].includes(effect))effect='fade';
 animateSlideChange(()=>{index=target;render()},direction,effect);
}
window.addEventListener('resize',stopSlideTransition);document.addEventListener('fullscreenchange',stopSlideTransition);
reducedMotion.addEventListener('change',()=>{stopSlideTransition();updateTransitionChoices()});

window.addEventListener('resize',size);document.addEventListener('fullscreenchange',()=>setTimeout(size,80));
let touchStart=null;$('#viewport').addEventListener('touchstart',e=>{if(e.target.closest('input,select,button,canvas'))return;touchStart=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('#viewport').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*2)go(index+(dx<0?1:-1));touchStart=null},{passive:true});
document.querySelector('footer').insertBefore($('#toc'),$('#pen'));$('#toc').textContent='目录';$('#fullscreen').textContent='全屏授课';
document.addEventListener('click',e=>{const b=e.target.closest('[data-reveal]');if(b)b.textContent=b.nextElementSibling.hidden?'显示解析':'收起解析'});
/* A movable palette leaves the slide geometry unchanged while annotating. */
function initFloatingInk(){
 const toolbar=$('#inkToolbar');
 window.InkAnnotationLayer.upgradeToolbarDOM(toolbar);
 const more=$('#inkMore');
 const bubble=document.createElement('button');bubble.id='inkBubble';bubble.type='button';bubble.hidden=true;bubble.title='展开批注窗；可拖动';bubble.setAttribute('aria-label','展开批注工具');bubble.innerHTML=window.InkAnnotationLayer.ACTION_ICONS.bubble;document.body.append(bubble);
 let folded=false,moved=false,drag=null;
 const footerTop=()=>document.querySelector('footer').getBoundingClientRect().top;
 const clamp=(value,min,max)=>Math.max(min,Math.min(Math.max(min,max),value));
 const setPosition=(node,x,y)=>{const r=node.getBoundingClientRect();node.style.left=clamp(x,8,innerWidth-r.width-8)+'px';node.style.top=clamp(y,8,footerTop()-r.height-8)+'px'};
 const sync=()=>{document.body.classList.remove('ink-open');document.documentElement.style.setProperty('--ink-dock-height','0px');toolbar.hidden=!penOn||folded;bubble.hidden=!penOn||!folded;const node=folded?bubble:toolbar;if(penOn){const r=node.getBoundingClientRect();setPosition(node,parseFloat(node.style.left)||Math.round((innerWidth-r.width)/2),parseFloat(node.style.top)||(footerTop()-r.height-12))}bubble.style.setProperty('--active-ink',inkSettings.color);toolbar.style.setProperty('--active-ink',inkSettings.color)};
 const fold=()=>{const r=toolbar.getBoundingClientRect();folded=true;bubble.style.left=(r.right-52)+'px';bubble.style.top=r.top+'px';sync()};
 const unfold=()=>{const r=bubble.getBoundingClientRect();folded=false;toolbar.classList.add('ink-simple');more.textContent='设置';more.setAttribute('aria-expanded','false');toolbar.hidden=false;setPosition(toolbar,r.right-toolbar.getBoundingClientRect().width,r.top);sync()};
 $('#inkFold').onclick=fold;$('#inkExit').onclick=()=>setPenMode(false);
 more.onclick=()=>{const r=toolbar.getBoundingClientRect();const simple=toolbar.classList.toggle('ink-simple');more.textContent=simple?'设置':'返回工具条';more.setAttribute('aria-expanded',String(!simple));setPosition(toolbar,r.right-toolbar.getBoundingClientRect().width,r.top);sync()};
 const originalSetPenMode=setPenMode;setPenMode=enabled=>{if(enabled&&!penOn){folded=false;if(inkSettings.tool==='cursor')inkSettings.tool='pen';}originalSetPenMode(enabled);if(enabled&&inkSettings.tool==='cursor')canvas.classList.remove('enabled');sync()};
 $('#inkClose').textContent='完成批注';$('#inkDrag').setAttribute('tabindex','0');$('#inkDrag').addEventListener('keydown',e=>{const delta={ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowUp:[0,-20],ArrowDown:[0,20]}[e.key];if(!delta)return;e.preventDefault();e.stopPropagation();const r=toolbar.getBoundingClientRect();setPosition(toolbar,r.left+delta[0],r.top+delta[1])});$('#inkMode').setAttribute('role','status');
 function attachDrag(handle,node,isBubble=false){
  handle.addEventListener('pointerdown',e=>{if(e.button!==0||(!isBubble&&e.target.closest('button')))return;const r=node.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top};moved=false;handle.setPointerCapture(e.pointerId);e.preventDefault()});
  handle.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)moved=true;if(moved)setPosition(node,drag.left+dx,drag.top+dy)});
  handle.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const clicked=!moved;drag=null;if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);if(isBubble&&clicked)unfold()});
  handle.addEventListener('pointercancel',()=>{drag=null;moved=true});
 }
 attachDrag($('#inkDrag'),toolbar);attachDrag(bubble,bubble,true);
 bubble.addEventListener('click',e=>{if(e.detail===0)unfold()});
 canvas.addEventListener('pointerdown',()=>{document.getElementById('inkSubMenu')?.classList.remove('palette-open')});
 toolbar.addEventListener('click',()=>{bubble.style.setProperty('--active-ink',inkSettings.color);toolbar.style.setProperty('--active-ink',inkSettings.color)});
 window.addEventListener('resize',sync);document.addEventListener('fullscreenchange',()=>requestAnimationFrame(sync));sync();
}
initFloatingInk();



const hash=location.hash.match(/slide-(\d+)(?:-act-(m\d+))?(?:-step-(\d+))?(?:-b-(\d+))?(-pen)?(-pal)?(-hl)?(-shp)?(-toc)?/);if(hash)index=Math.max(0,Math.min(slides.length-1,+hash[1]-1));render();size();if(hash&&hash[2]){simState.action=hash[2];runSimFn(ALL_SIMS[currentSimType],simState,false);syncSlideProgression(simState);bindSimControls(currentSimType);}if(hash&&hash[3])window.advanceSimStep(+hash[3]);if(hash&&hash[4])window.unlockSingleBlock(+hash[4]);if(hash&&hash[5])setPenMode(true);if(hash&&hash[8]){document.querySelector('[data-ink-tool="shape"]')?.click();inkPage().strokes.push({tool:'shape',shapeType:'axes',color:'#384d8f',size:3,dashed:false,points:[{x:580,y:460,w:3},{x:820,y:670,w:3}]},{tool:'shape',shapeType:'rttriangle',color:'#d94040',size:3.2,dashed:false,points:[{x:380,y:510,w:3.2},{x:530,y:660,w:3.2}]});rebuildInk();window.syncSubMenuDock?.();}else if(hash&&hash[7]){document.querySelector('[data-ink-tool="highlight"]')?.click();}else if(hash&&hash[6]){document.getElementById('inkSubMenu')?.classList.add('palette-open');window.syncSubMenuDock?.();}if(hash&&hash[9]){document.getElementById('toc')?.click();}
</script></body></html>

/* ================= AMC10数论大屏授课专属样式与排版修正 ================= */
body, .slide, h1, h2, h3, .flowbar, .flowbar button, .eyebrow, .subfoot,
.slide-body, .screen-stem p, .screen-notes, .readout, .thm-scene-wrap, .prob-visual-card {
  font-family: 'SimSun', 'Songti SC', 'STSong', serif !important;
}
.m, i.m, .math {
  font-family: 'Times New Roman', Times, serif !important;
  font-style: italic !important;
  font-weight: inherit;
  padding: 0 1px;
}
.num {
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-weight: inherit;
}
sup, sub {
  font-family: 'Times New Roman', Times, serif !important;
  font-size: 0.72em !important;
  line-height: 0 !important;
  white-space: nowrap !important;
}
sub span, sub i, sub b,
sup span, sup i, sup b,
.fraction span, .fraction i, .frac span, .frac i {
  font-size: inherit !important;
}
.tri-sym {
  font-family: 'Songti SC', 'SimSun', serif !important;
  font-style: normal !important;
  font-size: 0.80em !important;
  display: inline-block;
  transform: translateY(-0.07em);
  margin: 0 -0.06em 0 -0.04em;
  line-height: 1 !important;
}
.fraction, .frac {
  display: inline-flex;
  vertical-align: middle;
  flex-direction: column;
  align-items: center;
  text-align: center;
  line-height: 1.06;
  margin: 0 0.12em;
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-weight: inherit;
  font-size: 0.88em;
}
.fraction > span:first-child, .frac > span:first-child {
  border-bottom: 1.8px solid currentColor;
  padding: 0 0.22em 1px;
}
.fraction > span:last-child, .frac > span:last-child {
  padding: 1px 0.22em 0;
}
.sqrt {
  display: inline-flex !important;
  align-items: baseline !important;
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-weight: inherit;
  margin: 0 1px;
  white-space: nowrap !important;
}
.sqrt::before {
  content: "\221A";
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
  font-size: 1.06em;
  line-height: 1;
  margin-right: -0.04em;
}
.sqrt > span {
  border-top: 1.7px solid currentColor !important;
  padding: 0 2px 0 1px !important;
  line-height: 1.04 !important;
  font-family: 'Times New Roman', Times, serif !important;
  font-style: normal !important;
}
.sqrt > span i.m {
  font-family: 'Times New Roman', Times, serif !important;
  font-style: italic !important;
}
.overline {
  border-top: 1.8px solid currentColor;
  padding-top: 1px;
  display: inline-block;
  line-height: 1.05;
}

/* 页面整体高度预算修正与AMC10专属双层顶部导航栏（教室大屏大字号适配版） */
#viewport {
  height: calc(100dvh - 40px) !important;
}
footer {
  height: 40px !important;
  padding: 0 18px !important;
  gap: 10px !important;
  background: #0f172a !important;
  border-top: 1px solid #334155 !important;
  color: #e2e8f0 !important;
}
footer button {
  font-family: 'SimSun', 'Songti SC', serif !important;
  font-size: 15.5px !important;
  font-weight: 700 !important;
  padding: 4px 12px !important;
  border-radius: 6px !important;
  background: #1e293b !important;
  color: #e2e8f0 !important;
  border: 1px solid #475569 !important;
}
footer button:hover:not(:disabled) {
  background: #334155 !important;
  color: #ffffff !important;
  border-color: #64748b !important;
}
/* 隐藏底栏重复的上一页/下一页按钮，统一由屏幕左右极简半圆箭头侧耳负责翻页 */
footer #prev,
footer #next {
  display: none !important;
}
footer #pageCount {
  color: #e2e8f0 !important;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 2px 10px;
  font-family: 'Times New Roman', Times, serif !important;
  font-size: 16.5px !important;
  font-weight: 700 !important;
  min-width: 68px !important;
}

/* 屏幕左右边缘极简圆角矩形箭头翻页侧耳（大触控热区、低视觉干扰，开启批注时自动隐退） */
.edge-nav-paddle {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 15;
  width: 48px;
  height: 156px;
  border-radius: 0 16px 16px 0;
  background: rgba(30, 41, 59, 0.30);
  border: 1.5px solid rgba(148, 163, 184, 0.38);
  border-left: 0;
  color: rgba(255, 255, 255, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
  transition: transform 0.18s ease, background 0.18s ease, width 0.18s ease, color 0.18s ease;
  padding: 0;
}
.edge-nav-paddle.right {
  right: 0;
  left: auto;
  border-radius: 16px 0 0 16px;
  border-right: 0;
  border-left: 1.5px solid rgba(148, 163, 184, 0.38);
  padding-left: 2px;
}
.edge-nav-paddle.left {
  left: 0;
  padding-right: 2px;
}
.edge-nav-paddle svg {
  width: 32px;
  height: 32px;
  stroke: currentColor;
  stroke-width: 2.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.edge-nav-paddle:hover:not(:disabled) {
  width: 56px;
  background: rgba(2, 132, 199, 0.88);
  border-color: #7dd3fc;
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
}
.edge-nav-paddle:active:not(:disabled) {
  transform: translateY(-50%) scale(0.95);
}
.edge-nav-paddle:disabled {
  opacity: 0.12;
  cursor: default;
  pointer-events: none;
}
/* 关键防冲突机制：当开启批注画布（#penLayer.enabled）时，左右翻页侧耳自动隐藏并禁用点击 */
body:has(#penLayer.enabled) .edge-nav-paddle {
  display: none !important;
}
footer #slideTitle {
  color: #cbd5e1 !important;
  font-family: 'SimSun', 'Songti SC', serif !important;
  font-size: 16px !important;
  font-weight: 700 !important;

footer #fullscreen {

/* 隐藏底部栏中属于批注层内部或无需向学生展示的冗余按钮 */
footer #clearPen,
footer #effects,
footer #remote {
  display: none !important;
}

window.svgAutoFormatText = function(rawText, baseSize) {

  const subFs = Math.max(9.5, Math.round(fs * 0.75 * 10) / 10);

  const supDy = Math.round(fs * 0.36 * 10) / 10;

    pendingDy = 0;
    let attr = '';
    if (Math.abs(totalDy) > 0.01) attr += ` dy="${totalDy}"`;

// ================= 数学真实坐标系 SVG 确定性绘图底座（SeewoCoordCanvas，杜绝口算像素与图形画错） =================
window.createCoordCanvas = function(arg1 = {}, arg2, arg3) {
  const opts = (typeof arg1 === 'number')
    ? Object.assign({ width: arg1, height: arg2 }, arg3 || {})
    : (arg1 || {});
  const W = opts.width || 560;
  const H = opts.height || 430;
  const pad = Object.assign({ left: 46, right: 36, top: 36, bottom: 38 }, opts.padding || {});
  const xMin = opts.xRange ? opts.xRange[0] : (opts.xMin !== undefined ? opts.xMin : -5);
  const xMax = opts.xRange ? opts.xRange[1] : (opts.xMax !== undefined ? opts.xMax : 5);
  const yMin = opts.yRange ? opts.yRange[0] : (opts.yMin !== undefined ? opts.yMin : -4);
  const yMax = opts.yRange ? opts.yRange[1] : (opts.yMax !== undefined ? opts.yMax : 4);
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;
  const rawScaleX = plotW / (xMax - xMin);
  const rawScaleY = plotH / (yMax - yMin);
  const spanRatio = (xMax - xMin) / Math.max(1e-6, yMax - yMin);
  const equalAspect = opts.equalAspect !== undefined
    ? Boolean(opts.equalAspect)
    : (!opts.xStep && !opts.yStep && opts.xMin === undefined && spanRatio >= 0.85 && spanRatio <= 1.45 && (xMax - xMin) <= 16);
  const scaleX = equalAspect ? Math.min(rawScaleX, rawScaleY) : rawScaleX;
  const scaleY = equalAspect ? Math.min(rawScaleX, rawScaleY) : rawScaleY;
  const ox = pad.left + (-xMin) * scaleX + (equalAspect ? (plotW - (xMax - xMin) * scaleX) / 2 : 0);
  const oy = pad.top + yMax * scaleY + (equalAspect ? (plotH - (yMax - yMin) * scaleY) / 2 : 0);
  const els = [];

  function px(x) { return ox + x * scaleX; }
  function py(y) { return oy - y * scaleY; }
  function pt(p) { return Array.isArray(p) ? [px(p[0]), py(p[1])] : [px(p.x), py(p.y)]; }

  const api = {
    W, H, ox, oy, scaleX, scaleY, px, py, pt,
    sx: px, sy: py, X: px, Y: py,
    raw(svgSnippet) { if (svgSnippet) els.push(svgSnippet); return this; },
    add(svgSnippet) { if (svgSnippet) els.push(svgSnippet); return this; },
    drawAxes(cfg = {}) {
      const x0 = px(xMin), x1 = px(xMax), y0 = py(yMin), y1 = py(yMax);
      const axisColor = cfg.color || '#1e293b';
      const xStep = cfg.xStep || opts.xStep || 1;
      const yStep = cfg.yStep || opts.yStep || 1;
      if (cfg.showGrid) {
        for (let gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax + 1e-6; gx += xStep) {
          if (Math.abs(gx) < 1e-6) continue;
          els.push(`<line x1="${px(gx).toFixed(1)}" y1="${y1.toFixed(1)}" x2="${px(gx).toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`);
        }
        for (let gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax + 1e-6; gy += yStep) {
          if (Math.abs(gy) < 1e-6) continue;
          els.push(`<line x1="${x0.toFixed(1)}" y1="${py(gy).toFixed(1)}" x2="${x1.toFixed(1)}" y2="${py(gy).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`);
        }
      }
      if (cfg.showTicks || opts.xStep || opts.yStep) {
        for (let gx = Math.ceil(xMin / xStep) * xStep; gx <= xMax - xStep * 0.3; gx += xStep) {
          if (Math.abs(gx) < 1e-6 || gx < 0) continue;
          els.push(`<line x1="${px(gx).toFixed(1)}" y1="${oy.toFixed(1)}" x2="${px(gx).toFixed(1)}" y2="${(oy - 5).toFixed(1)}" stroke="${axisColor}" stroke-width="1.5"/>`);
          els.push(`<text x="${px(gx).toFixed(1)}" y="${(oy + 19).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">${Math.round(gx * 100) / 100}</text>`);
        }
        for (let gy = Math.ceil(yMin / yStep) * yStep; gy <= yMax - yStep * 0.3; gy += yStep) {
          if (Math.abs(gy) < 1e-6 || gy < 0) continue;
          els.push(`<line x1="${ox.toFixed(1)}" y1="${py(gy).toFixed(1)}" x2="${(ox + 5).toFixed(1)}" y2="${py(gy).toFixed(1)}" stroke="${axisColor}" stroke-width="1.5"/>`);
          els.push(`<text x="${(ox - 7).toFixed(1)}" y="${(py(gy) + 4).toFixed(1)}" text-anchor="end" font-size="13" font-weight="600" fill="#475569">${Math.round(gy * 100) / 100}</text>`);
        }
      }
      els.push(`<line x1="${x0.toFixed(1)}" y1="${oy.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="${axisColor}" stroke-width="2"/>`);
      els.push(`<polygon points="${(x1 + 6).toFixed(1)},${oy.toFixed(1)} ${(x1 - 7).toFixed(1)},${(oy - 4.8).toFixed(1)} ${(x1 - 7).toFixed(1)},${(oy + 4.8).toFixed(1)}" fill="${axisColor}"/>`);
      els.push(`<line x1="${ox.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${axisColor}" stroke-width="2"/>`);
      els.push(`<polygon points="${ox.toFixed(1)},${(y1 - 6).toFixed(1)} ${(ox - 4.8).toFixed(1)},${(y1 + 7).toFixed(1)} ${(ox + 4.8).toFixed(1)},${(y1 + 7).toFixed(1)}" fill="${axisColor}"/>`);
      els.push(`<text x="${(x1 - 4).toFixed(1)}" y="${(oy + 24).toFixed(1)}" text-anchor="end" font-size="16" font-weight="700" fill="${axisColor}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(cfg.xLabel || opts.xLabel || 'x', 16)}</text>`);
      els.push(`<text x="${(ox + 12).toFixed(1)}" y="${(y1 + 14).toFixed(1)}" font-size="16" font-weight="700" fill="${axisColor}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(cfg.yLabel || opts.yLabel || 'y', 16)}</text>`);
      if (cfg.showOrigin !== false) {
        const oxOff = cfg.originOffset ? cfg.originOffset[0] : -16;
        const oyOff = cfg.originOffset ? cfg.originOffset[1] : 20;
        els.push(`<text x="${(ox + oxOff).toFixed(1)}" y="${(oy + oyOff).toFixed(1)}" font-size="16" font-weight="700" fill="${axisColor}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText('O', 16)}</text>`);
      }
      return this;
    },
    drawHyperbola(k, cfg = {}) {
      const color = cfg.color || '#1e293b';
      const width = cfg.width || 2.5;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      const branches = cfg.branches || ['pos', 'neg'];
      const stepCount = 70;
      branches.forEach(br => {
        const domMin = br === 'pos' ? Math.max(0.15, cfg.xMin || 0.25) : Math.min(-0.15, cfg.xMin || xMin + 0.2);
        const domMax = br === 'pos' ? Math.min(xMax - 0.15, cfg.xMax || xMax - 0.2) : Math.min(-0.15, cfg.xMax || -0.25);
        const pts = [];
        for (let i = 0; i <= stepCount; i++) {
          const x = domMin + (domMax - domMin) * (i / stepCount);
          const y = k / x;
          if (y < yMin + 0.15 || y > yMax - 0.15) continue;
          pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
        }
        if (pts.length > 1) {
          els.push(`<polyline fill="none" stroke="${color}" stroke-width="${width}"${dash} stroke-linecap="round" points="${pts.join(' ')}"/>`);
        }
      });
      return this;
    },
    curve(fn, domMin, domMax, colorOrCfg, widthArg, dashArg) {
      const cfg = (typeof colorOrCfg === 'object' && colorOrCfg !== null) ? colorOrCfg : { stroke: colorOrCfg, width: widthArg, dash: dashArg };
      const color = cfg.stroke || cfg.color || '#1e293b';
      const width = cfg.width || 2.6;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      const stepCount = 80;
      const pts = [];
      for (let i = 0; i <= stepCount; i++) {
        const x = domMin + (domMax - domMin) * (i / stepCount);
        const y = fn(x);
        if (!Number.isFinite(y) || y < yMin - (yMax - yMin) * 0.2 || y > yMax + (yMax - yMin) * 0.2) continue;
        pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
      }
      if (pts.length > 1) {
        els.push(`<polyline fill="none" stroke="${color}" stroke-width="${width}"${dash} stroke-linecap="round" points="${pts.join(' ')}"/>`);
      }
      return this;
    },
    shadedRegion(fn, x1, x2, fill = 'rgba(37,99,235,0.12)') {
      const stepCount = 40;
      const pts = [`${px(x1).toFixed(1)},${py(0).toFixed(1)}`];
      for (let i = 0; i <= stepCount; i++) {
        const x = x1 + (x2 - x1) * (i / stepCount);
        const y = fn(x);
        if (Number.isFinite(y)) pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
      }
      pts.push(`${px(x2).toFixed(1)},${py(0).toFixed(1)}`);
      els.push(`<polygon points="${pts.join(' ')}" fill="${fill}" stroke="none"/>`);
      return this;
    },
    drawPolygon(mathPts, cfg = {}) {
      const svgPts = mathPts.map(p => {
        const [sx, sy] = pt(p);
        return `${sx.toFixed(1)},${sy.toFixed(1)}`;
      }).join(' ');
      const fill = cfg.fill || 'rgba(37,99,235,0.16)';
      const stroke = cfg.stroke || '#2563eb';
      const width = cfg.width !== undefined ? cfg.width : 2.2;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      els.push(`<polygon points="${svgPts}" fill="${fill}" stroke="${stroke}" stroke-width="${width}"${dash} stroke-linejoin="round"/>`);
      return this;
    },
    polygon(mathPts, fillOrCfg, strokeArg, widthArg) {
      const cfg = (typeof fillOrCfg === 'object' && fillOrCfg !== null) ? fillOrCfg : { fill: fillOrCfg, stroke: strokeArg || 'none', width: widthArg !== undefined ? widthArg : (strokeArg ? 2 : 0) };
      return this.drawPolygon(mathPts, cfg);
    },
    drawSegment(p1, p2, cfg = {}) {
      const [x1, y1] = pt(p1), [x2, y2] = pt(p2);
      const color = cfg.stroke || cfg.color || '#475569';
      const width = cfg.width || 1.8;
      const dash = cfg.dash ? ` stroke-dasharray="${cfg.dash}"` : '';
      els.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${width}"${dash} stroke-linecap="round"/>`);
      return this;
    },
    line(x1, y1, x2, y2, colorOrCfg, widthArg, dashArg) {
      const cfg = (typeof colorOrCfg === 'object' && colorOrCfg !== null) ? colorOrCfg : { color: colorOrCfg, width: widthArg, dash: dashArg };
      return this.drawSegment([x1, y1], [x2, y2], cfg);
    },
    drawRightAngle(vertex, p1, p2, size = 9, color = '#475569') {
      const [vx, vy] = pt(vertex), [x1, y1] = pt(p1), [x2, y2] = pt(p2);
      const d1 = Math.hypot(x1 - vx, y1 - vy) || 1;
      const d2 = Math.hypot(x2 - vx, y2 - vy) || 1;
      const u1x = (x1 - vx) / d1 * size, u1y = (y1 - vy) / d1 * size;
      const u2x = (x2 - vx) / d2 * size, u2y = (y2 - vy) / d2 * size;
      els.push(`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${(vx + u1x).toFixed(1)},${(vy + u1y).toFixed(1)} ${(vx + u1x + u2x).toFixed(1)},${(vy + u1y + u2y).toFixed(1)} ${(vx + u2x).toFixed(1)},${(vy + u2y).toFixed(1)}"/>`);
      return this;
    },
    drawPoint(mathPt, cfg = {}) {
      const [sx, sy] = pt(mathPt);
      const r = cfg.r !== undefined ? cfg.r : 4.5;
      const color = cfg.color || '#1e293b';
      if (r > 0) {
        els.push(`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r}" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>`);
      }
      if (cfg.label) {
        const dx = cfg.dx !== undefined ? cfg.dx : 8;
        const dy = cfg.dy !== undefined ? cfg.dy : -8;
        const fs = cfg.fontSize || 16;
        const anchor = cfg.anchor || (dx < -2 ? 'end' : 'start');
        els.push(`<text x="${(sx + dx).toFixed(1)}" y="${(sy + dy).toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="700" fill="${cfg.labelColor || color}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(cfg.label, fs)}</text>`);
      }
      return this;
    },
    point(xOrPt, yOrCfg, labelArg, colorOrCfg, dxArg, dyArg, rArg) {
      if (Array.isArray(xOrPt)) return this.drawPoint(xOrPt, yOrCfg || {});
      const cfg = (typeof colorOrCfg === 'object' && colorOrCfg !== null)
        ? Object.assign({ label: labelArg }, colorOrCfg)
        : { label: labelArg, color: colorOrCfg, dx: dxArg, dy: dyArg, r: rArg };
      return this.drawPoint([xOrPt, yOrCfg], cfg);
    },
    projPoint(x, y, label, cfg = {}) {
      const color = cfg.color || '#1e293b';
      const dashColor = cfg.dashColor || '#64748b';
      this.drawSegment([x, y], [x, 0], { color: dashColor, width: 1.5, dash: '4,3' });
      this.drawSegment([x, y], [0, y], { color: dashColor, width: 1.5, dash: '4,3' });
      if (cfg.showTickX) {
        els.push(`<text x="${px(x).toFixed(1)}" y="${(oy + 19).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="${color}" stroke="#ffffff" stroke-width="4.5" paint-order="stroke">${Math.round(x * 100) / 100}</text>`);
      }
      if (cfg.showTickY) {
        els.push(`<text x="${(ox - 7).toFixed(1)}" y="${(py(y) + 4).toFixed(1)}" text-anchor="end" font-size="13" font-weight="700" fill="${color}" stroke="#ffffff" stroke-width="4.5" paint-order="stroke">${Math.round(y * 100) / 100}</text>`);
      }
      return this.drawPoint([x, y], Object.assign({}, cfg, { label }));
    },
    drawText(mathPt, textStr, cfg = {}) {
      const [sx, sy] = pt(mathPt);
      const fs = cfg.fontSize || cfg.size || 16;
      const anchor = cfg.anchor || 'middle';
      const color = cfg.fill || cfg.color || '#1e293b';
      els.push(`<text x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="${cfg.weight || 700}" fill="${color}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(textStr, fs)}</text>`);
      return this;
    },
    text(x, y, textStr, colorOrCfg, sizeArg, anchorArg, weightArg) {
      if (typeof colorOrCfg === 'object' && colorOrCfg !== null) {
        const fs = colorOrCfg.size || colorOrCfg.fontSize || 15;
        const anchor = colorOrCfg.anchor || 'start';
        const color = colorOrCfg.fill || colorOrCfg.color || '#1e293b';
        const weight = colorOrCfg.weight || 700;
        els.push(`<text x="${Number(x).toFixed(1)}" y="${Number(y).toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="${weight}" fill="${color}" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${window.svgAutoFormatText(textStr, fs)}</text>`);
        return this;
      }
      return this.drawText([x, y], textStr, { color: colorOrCfg, fontSize: sizeArg, anchor: anchorArg, weight: weightArg });
    },
    drawFoCard(x, y, w, h, innerHtml, extraStyle = '') {
      els.push(window.svgFoCard(x, y, w, h, innerHtml, extraStyle));
      return this;
    },
    toSvg(extraAttr = '') {
      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;max-height:100%;display:block;" ${extraAttr}>${els.join('\n')}</svg>`;
    },
    done(extraAttr = '') {
      return this.toSvg(extraAttr);
    }
  };

  if (opts.xStep || opts.yStep || opts.autoAxes) {
    api.drawAxes({ showGrid: opts.showGrid !== false, showTicks: true, xLabel: opts.xLabel, yLabel: opts.yLabel });
  }

  return api;
};

// ================= 声明式课件页面构建器（window.defineSlide，强制 1对1 步数/填空/图形同步契约） =================
window.formatInlineMathHTML = function(rawStr) {
  if (!rawStr) return '';
  const s = String(rawStr);
  if (/<(span|i|sup|sub|b)\b/i.test(s)) return s;
  let clean = s
    .replace(/([\u4e00-\u9fff])\s+([A-Za-z0-9△▱∠⊥∥∽≌=+\-√])/g, '$1$2')
    .replace(/([A-Za-z0-9△▱∠⊥∥∽≌²³)])\s+([\u4e00-\u9fff])/g, '$1$2')
    .replace(/\s*([=+\-∶:∽≌∥⊥⇒])\s*/g, '$1');
  function fmtAtom(seg) {
    return seg.replace(/([0-9]+(?:\.[0-9]+)?)?√\(([^)]+)\)|([0-9]+(?:\.[0-9]+)?)?√([0-9A-Za-z²³+\-]+)|Rt△|△|[A-Za-z]+|[0-9]+(?:\.[0-9]+)?|[²³]|[=+\-±×÷·:∶∠⊥∥∽≌°⇒/]/g, (m, c1, radParen, c2, radBare) => {
      if (radParen !== undefined || radBare !== undefined) {
        const coef = c1 || c2 || '';
        const inner = radParen !== undefined ? radParen : radBare;
        const coefHtml = coef ? `<span class="num">${coef}</span>` : '';
        return `<span style="white-space:nowrap;">${coefHtml}<span class="sqrt"><span>${fmtAtom(inner)}</span></span></span>`;
      }
      if (m === 'Rt△') return '<span class="num">Rt</span><span class="tri-sym">△</span>';
      if (m === '△') return '<span class="tri-sym">△</span>';
      if (m === '²') return '<sup><span class="num">2</span></sup>';
      if (m === '³') return '<sup><span class="num">3</span></sup>';
      if (/^[A-Za-z]+$/.test(m)) return `<i class="m">${m}</i>`;
      return `<span class="num">${m}</span>`;
    });
  }
  return fmtAtom(clean);
};

window.defineSlide = function(cfg) {
  window.UNIT1_THEOREM_SLIDES = window.UNIT1_THEOREM_SLIDES || [];
  window.UNIT1_SIMS = window.UNIT1_SIMS || {};
  if (cfg.cover) {
    window.UNIT1_THEOREM_SLIDES.push({
      lesson: cfg.lesson || 1,
      phase: 0,
      navTag: cfg.navTag || '课时导览',
      section: cfg.section || '课时导览',
      title: cfg.title || window.COURSEWARE_TITLE || '',
      cover: true,
      html: cfg.html || window.renderStandardCover(cfg)
    });
    return;
  }
  const layout = cfg.layout || 'layout-b';
  const steps = Array.isArray(cfg.steps) ? cfg.steps : [];
  const maxStep = steps.length;
  const simName = cfg.sim || (`autoSim_${window.UNIT1_THEOREM_SLIDES.length + 1}`);
  const stepsHTML = steps.map((st, idx) => {
    const num = idx + 1;
    const badge = String(num).padStart(2, '0');
    let stTitle = '', bodyPart = '';
    if (Array.isArray(st)) {
      stTitle = st[0] || '';
      bodyPart = st[1] || '';
    } else if (typeof st === 'object' && st !== null) {
      stTitle = st.title || '';
      bodyPart = st.html || st.body || st.text || '';
    } else {
      bodyPart = String(st || '');
    }
    const fmtTitle = window.formatInlineMathHTML(stTitle);
    const titlePart = fmtTitle ? `<b>步骤<span class="num">${num}</span>（${fmtTitle}）：</b>` : `<b>步骤<span class="num">${num}</span>：</b>`;
    return `<div class="step step-locked"><b>${badge}</b><span>${titlePart}${bodyPart}</span></div>`;
  }).join('\n          ');

  const mediaBlock = layout === 'layout-a' ? '' : `
        <div class="screen-media">
          <div class="screen-lab">
            <div id="scene" class="visual" style="padding:8px;align-items:stretch;justify-content:center;"></div>
          </div>
        </div>`;

  const slideHTML = `
    <div class="screen-page lab-visible">
      <div class="screen-stem">
        ${cfg.stem || ''}
      </div>
      <div class="screen-lower ${layout}">
        <div class="screen-notes">
          <div id="controls" class="controls"></div>
          ${stepsHTML}
        </div>${mediaBlock}
      </div>
    </div>
  `;

  window.UNIT1_THEOREM_SLIDES.push({
    lesson: cfg.lesson || 1,
    phase: typeof cfg.phase === 'number' ? cfg.phase : 1,
    navTag: cfg.navTag || '',
    section: cfg.section || '',
    title: cfg.title || '',
    cover: false,
    sim: simName,
    html: slideHTML
  });

  window.UNIT1_SIMS[simName] = function(state, isInit) {
    if (isInit) {
      state.step = 0;
      clearManualOverrides(state);
      const defaultState = cfg.state || cfg.initState;
      if (defaultState && typeof defaultState === 'object') {
        Object.keys(defaultState).forEach(k => { state[k] = defaultState[k]; });
      }
      if (typeof cfg.onInit === 'function') cfg.onInit(state);
    }
    const root = activeRoot();
    if (root && !root.slider) {
      root.slider = window.slider;
      root.modeButtons = window.modeButtons;
      root.stepBar = window.stepBar;
    }
    const step = Number(state.step || 0);
    const controls = root.querySelector('#controls');
    if (controls) {
      const extraCtrl = typeof cfg.controls === 'function' ? (cfg.controls(step, state, root) || '') : '';
      controls.innerHTML = stepBar(step, maxStep) + extraCtrl;
    }
    const scene = root.querySelector('#scene');
    if (scene && typeof cfg.renderScene === 'function') {
      scene.innerHTML = cfg.renderScene(step, state, root) || '';
    }
  };
};

// ================= 一题多图（图(1)~图(k)）总览与单图自动放大标准容器（杜绝多图与步骤脱节） =================
window.renderMultiPanelScene = function(step, panels, opts = {}) {
  const W = opts.width || 560;
  const H = opts.height || 430;
  const list = Array.isArray(panels) ? panels : [];
  if (!list.length) return `<svg viewBox="0 0 ${W} ${H}"></svg>`;

  if (!step || step <= 0) {
    const n = list.length;
    const cols = n <= 2 ? 2 : (n === 3 ? 3 : (n === 4 ? 2 : 3));
    const rows = Math.ceil(n / cols);
    const padX = 12, padY = 10, gapX = 10, gapY = 10;
    const cellW = Math.floor((W - padX * 2 - gapX * (cols - 1)) / cols);
    const cellH = Math.floor((H - padY * 2 - gapY * (rows - 1)) / rows);
    const cells = list.map((p, idx) => {
      const r = Math.floor(idx / cols);
      const itemsInRow = (r === rows - 1 && n % cols !== 0) ? (n % cols) : cols;
      const rowW = itemsInRow * cellW + (itemsInRow - 1) * gapX;
      const startX = Math.floor((W - rowW) / 2);
      const c = idx % cols;
      const x0 = startX + c * (cellW + gapX);
      const y0 = padY + r * (cellH + gapY);
      const gotoStep = p.targetStep || (Array.isArray(p.steps) ? p.steps[0] : (idx + 1));
      const inner = typeof p.render === 'function' ? p.render({ x0, y0, w: cellW, h: cellH, zoomed: false, step: 0 }) : '';
      return `<g data-step-goto="${gotoStep}" style="cursor:pointer;">
        <rect x="${x0}" y="${y0}" width="${cellW}" height="${cellH}" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        ${p.title ? `<text x="${(x0 + cellW / 2).toFixed(1)}" y="${(y0 + 20).toFixed(1)}" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">${window.svgAutoFormatText(p.title, 13.5)}</text>` : ''}
        ${inner}
      </g>`;
    }).join('\n');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;max-height:100%;display:block;">${cells}</svg>`;
  }

  let activePanel = list.find(p => Array.isArray(p.steps) ? p.steps.includes(step) : p.targetStep === step);
  if (!activePanel) activePanel = list[Math.min(list.length - 1, Math.max(0, step - 1))];
  const zoomedInner = typeof activePanel.render === 'function'
    ? activePanel.render({ x0: 14, y0: 12, w: W - 28, h: H - 24, zoomed: true, step })
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;max-height:100%;display:block;">
    <rect x="14" y="12" width="${W - 28}" height="${H - 24}" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    ${activePanel.title ? `<text x="${(W / 2).toFixed(1)}" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">${window.svgAutoFormatText(activePanel.title, 16)}</text>` : ''}
    ${zoomedInner}
    <g data-step-goto="0" style="cursor:pointer;">
      <rect x="${W - 148}" y="20" width="122" height="26" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="${W - 87}" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">${window.svgAutoFormatText('⊞ 返回多图总览', 12.5)}</text>
    </g>
  </svg>`;
};

// ================= 波利亚级（Polya-Grade）SVG 几何图示清晰标注引擎（100% 纯原生 SVG 图元，严禁嵌套子 <svg>） =================
// 1. 顶部色彩图例条（纯 SVG 绘制，彻底杜绝 .visual svg 样式污染导致图标放大）
window.svgLegendBar = function(items, opts = {}) {
  const list = Array.isArray(items) ? items.filter(Boolean) : [];
  if (!list.length) return '';
  const x = opts.x !== undefined ? opts.x : 12;
  const y = opts.y !== undefined ? opts.y : 6;
  const w = opts.width || 516;
  const h = opts.height || 28;
  const cy = y + h / 2;
  const fs = opts.fontSize || 12.5;

  function estTextW(str) {
    let tw = 0;
    const s = String(str || '');
    for (let i = 0; i < s.length; i++) {
      tw += fs * (s.charCodeAt(i) > 127 ? 0.92 : 0.54);
    }
    return tw;
  }

  const measured = list.map(it => {
    const type = it.type || 'angle';
    const iconW = type === 'dash' ? 18 : (type === 'line' ? 16 : 15);
    const rawTxt = String(it.text || it.html || '').replace(/<[^>]+>/g, '');
    const tw = estTextW(rawTxt);
    return { it, type, iconW, rawTxt, tw, totalW: iconW + 4 + tw };
  });

  const gap = 16;
  const sumW = measured.reduce((acc, m) => acc + m.totalW, 0) + gap * (measured.length - 1);
  let curX = x + Math.max(8, (w - sumW) / 2);

  let out = `<g class="svg-legend-bar">`;
  out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="rgba(248,250,252,0.96)" stroke="#cbd5e1" stroke-width="1.2"/>`;

  measured.forEach((m, idx) => {
    const color = m.it.color || '#2563eb';
    if (m.type === 'angle') {
      out += `<path d="M ${(curX + 13).toFixed(1)} ${(cy + 5).toFixed(1)} L ${(curX + 1).toFixed(1)} ${(cy + 5).toFixed(1)} L ${(curX + 10).toFixed(1)} ${(cy - 5).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
      out += `<path d="M ${(curX + 8).toFixed(1)} ${(cy + 5).toFixed(1)} A 6.5 6.5 0 0 0 ${(curX + 6.3).toFixed(1)} ${(cy - 0.8).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    } else if (m.type === 'dash') {
      out += `<line x1="${curX.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(curX + 18).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${color}" stroke-width="2.4" stroke-dasharray="4 3" stroke-linecap="round"/>`;
    } else if (m.type === 'tri') {
      out += `<polygon points="${(curX + 7).toFixed(1)},${(cy - 5.5).toFixed(1)} ${(curX + 1).toFixed(1)},${(cy + 5).toFixed(1)} ${(curX + 13).toFixed(1)},${(cy + 5).toFixed(1)}" fill="${m.it.fill || 'rgba(234,88,12,0.22)'}" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`;
    } else {
      out += `<line x1="${curX.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(curX + 16).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>`;
    }
    const tx = curX + m.iconW + 4;
    const ty = cy + 4.5;
    out += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-family="'Times New Roman', 'Songti SC', SimSun, serif" font-weight="700" font-size="${fs}" fill="${color}" text-anchor="start">${window.svgAutoFormatText(m.rawTxt, fs)}</text>`;
    curX += m.totalW + gap;
    if (idx < measured.length - 1) {
      const sepX = curX - gap / 2;
      out += `<line x1="${sepX.toFixed(1)}" y1="${(y + 6).toFixed(1)}" x2="${sepX.toFixed(1)}" y2="${(y + h - 6).toFixed(1)}" stroke="#cbd5e1" stroke-width="1.2"/>`;
    }
  });

  out += `</g>`;
  return out;
};

// 2. 数字角直观标注（支持同顶点阶梯半径与纯数字 1, 2, 3, 4, 5 标注，配角平分线引线防挤压）
window.svgNumberedAngle = function(v, pStart, pEnd, numStr, opts = {}) {
  const radius = opts.radius || 28;
  const color = opts.color || '#2563eb';
  const fill = opts.fill || 'none';
  const labelDist = opts.labelDist || (radius + 13);
  const dx1 = pStart[0] - v[0], dy1 = pStart[1] - v[1];
  const dx2 = pEnd[0] - v[0], dy2 = pEnd[1] - v[1];
  let a1 = Math.atan2(dy1, dx1);
  let a2 = Math.atan2(dy2, dx2);
  let diff = a2 - a1;
  while (diff <= -Math.PI) diff += Math.PI * 2;
  while (diff > Math.PI) diff -= Math.PI * 2;
  const sweep = diff > 0 ? 1 : 0;
  const sx = v[0] + Math.cos(a1) * radius;
  const sy = v[1] + Math.sin(a1) * radius;
  const ex = v[0] + Math.cos(a2) * radius;
  const ey = v[1] + Math.sin(a2) * radius;
  let out = '';
  if (fill && fill !== 'none') {
    out += `<path d="M ${v[0].toFixed(1)} ${v[1].toFixed(1)} L ${sx.toFixed(1)} ${sy.toFixed(1)} A ${radius} ${radius} 0 0 ${sweep} ${ex.toFixed(1)} ${ey.toFixed(1)} Z" fill="${fill}" stroke="none"/>`;
  }
  out += `<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${radius} ${radius} 0 0 ${sweep} ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${color}" stroke-width="2.1"/>`;
  if (numStr !== undefined && numStr !== null && String(numStr) !== '') {
    const midA = a1 + diff / 2 + (opts.angleShift || 0);
    const lx = v[0] + Math.cos(midA) * labelDist + (opts.dx || 0);
    const ly = v[1] + Math.sin(midA) * labelDist + 4.5 + (opts.dy || 0);
    if (opts.leader) {
      const mx = v[0] + Math.cos(midA) * (radius * 0.75);
      const my = v[1] + Math.sin(midA) * (radius * 0.75);
      const tx = v[0] + Math.cos(midA) * (labelDist - 7) + (opts.dx || 0);
      const ty = v[1] + Math.sin(midA) * (labelDist - 7) + (opts.dy || 0);
      out += `<line x1="${mx.toFixed(1)}" y1="${my.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${color}" stroke-width="1.3"/>`;
    }
    const inner = window.svgAutoFormatText(String(numStr), opts.fontSize || 14);
    out += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-family="'Times New Roman', 'Songti SC', SimSun, serif" font-weight="700" font-size="${opts.fontSize || 14}" fill="${color}" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">${inner}</text>`;
  }
  return out;
};

// 3. 求解目标/关键结论引线气泡框（如“求 BC = ?”或“BC = 4√3”）
window.svgCalloutTag = function(anchorPt, boxRect, innerHtml, opts = {}) {
  const color = opts.color || '#15803d';
  const bg = opts.bg || '#f0fdf4';
  const [ax, ay] = anchorPt;
  const [bx, by, bw, bh] = boxRect;
  const cy = by + bh / 2;
  const startX = ax < bx ? bx : (ax > bx + bw ? bx + bw : bx + bw / 2);
  return `<g>
    <line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${startX.toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${color}" stroke-width="1.8"/>
    <circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="3.2" fill="${color}"/>
    <foreignObject x="${bx}" y="${by}" width="${bw}" height="${bh}" style="overflow:visible;">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;background:${bg};border:1.8px solid ${color};border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 8px;font-family:'Times New Roman','Songti SC','SimSun',serif;font-size:14.5px;font-weight:700;color:${color};white-space:nowrap;box-shadow:0 2px 5px rgba(15,23,42,0.06);">${innerHtml}</div>
    </foreignObject>
  </g>`;
};
